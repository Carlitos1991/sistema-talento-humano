{% load static %}
<div class="modal-overlay hidden">
    <div class="modal-container-medium">
        <form id="documentForm" method="POST" action="{{ request.path }}" onsubmit="submitAjaxForm(event);">
            {% csrf_token %}

            <div class="modal-header-medium">
                <h3 class="header-title">
                    <i class="fa-solid fa-file-signature me-2"></i>
                    <span>{% if form.instance.pk %}Editar Documento{% else %}Nuevo Documento ({{ category.name }}
                        ){% endif %}</span>
                </h3>
                <button type="button" class="btn-close-circle" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="modal-body-content modal-body-custom">
                <input type="hidden" name="category" value="{{ category.id|default:form.instance.category_id }}">

                <div class="form-section-card">
                    <div class="row g-3">
                        <div class="col-md-6 form-group">
                            <label class="form-label">Número de documento / Archivo</label>
                            <input type="text" name="filing_code" class="input-field readonly-styled"
                                   value="{{ next_code|default:form.instance.filing_code }}" readonly>
                        </div>
                        <div class="col-md-6 form-group">
                            <label class="form-label">Responsable / Remitente</label>
                            <input type="text" name="sender_name" class="input-field readonly-styled"
                                   value="{{ form.instance.sender_name|default:user.get_full_name }}" readonly
                                   tabindex="-1">
                        </div>
                    </div>

                    {% if not form.instance.pk %}
                        <div class="row g-3 mt-1">
                            <div class="col-md-4 form-group">
                                <label class="form-label">Cantidad a generar</label>
                                <input type="number" name="quantity" class="input-field" min="1" max="20" value="1">
                            </div>
                            <div class="col-md-8 form-group">
                                <label class="form-label">A Quién va Dirigido <span class="text-red">*</span></label>
                                <input type="text" name="recipient_name" class="input-field" required
                                       placeholder="Nombre o cargo del destinatario">
                            </div>
                        </div>
                    {% else %}
                        <div class="form-group mt-3">
                            <label class="form-label">A Quién va Dirigido <span class="text-red">*</span></label>
                            <input type="text" name="recipient_name" class="input-field" required
                                   value="{{ form.instance.recipient_name }}">
                        </div>
                    {% endif %}

                    <div class="form-group mt-3">
                        <label class="form-label">Asunto <span class="text-red">*</span></label>
                        <input type="text" name="subject" class="input-field" required
                               value="{{ form.instance.subject|default:'' }}"
                               placeholder="Breve descripción del asunto">
                    </div>

                    <div class="form-group mt-3">
                        <label class="form-label">Observaciones</label>
                        <textarea name="observation" class="form-control"
                                  rows="3">{{ form.instance.observation|default:'' }}</textarea>
                    </div>

                    {% if not form.instance.pk %}
                        <div class="form-group mt-3">
                            <label class="form-label">Adjuntar Archivo (PDF opcional)</label>
                            <input type="file" name="file_attachment" class="form-control" accept=".pdf">
                        </div>
                    {% endif %}
                </div>
            </div>

            <div class="modal-footer-medium modal-footer-spaced">
                <button type="button" class="btn-default-outline" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-dark-blue-rectangle">
                    <i class="fas fa-save me-1"></i> {% if form.instance.pk %}Actualizar{% else %}Guardar{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
