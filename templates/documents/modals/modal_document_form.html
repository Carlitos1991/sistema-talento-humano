<div id="documentModal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-container animate-scale-in" style="max-width:820px; width:calc(100% - 40px);">

        <!-- HEADER -->
        <div class="modal-header modal-header-gradient">
            <h3 class="modal-title text-white" id="modalTitle">
                <i class="fa-solid fa-file-circle-plus me-2"></i> Nuevo Documento
            </h3>
            <button type="button" class="btn-close-modal text-white-opacity" id="modal-close-btn">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
        </div>

        <!-- FORM WRAPPER (includes body + footer) -->
        <form id="documentForm" enctype="multipart/form-data"
              style="display: flex; flex-direction: column; height: 100%;">
            {% csrf_token %}

            <!-- BODY -->
            <div class="modal-body modal-body-custom">
                <!-- Campos ocultos -->
                <input type="hidden" id="modal_category_name" name="modal_category_name">
                <input type="hidden" id="modal_filing_code" name="filing_code">
                <input type="hidden" id="modal_category" name="category">
                <input type="hidden" id="modal_sender_name" name="sender_name">

                <!-- Cantidad y Asunto en la misma fila: Cantidad pequeño, Asunto grande -->
                <div id="grid-cantidad-asunto" class="grid-cantidad-asunto"
                     style="display: grid !important; grid-template-columns: 1fr 3fr !important; gap: 1rem !important; align-items: flex-start !important;">
                    <div id="modal_quantity_group" class="form-group" style="margin-bottom: 0 !important;">
                        <label class="form-label">
                            <i class="fa-solid fa-file"></i> Cantidad (*)
                        </label>
                        <input type="text" id="modal_quantity" name="quantity" class="form-control input-field"
                               value="1"
                               inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2" required>
                    </div>

                    <div class="form-group" style="margin-bottom: 0 !important;">
                        <label class="form-label">
                            <i class="fa-solid fa-heading"></i> Asunto (*)
                        </label>
                        <input type="text" name="subject" class="form-control input-field" required
                               placeholder="Ej: Solicitud de disponibilidad">
                    </div>
                </div>

                <!-- A Quién va Dirigido -->
                <div class="form-group">
                    <label class="form-label">
                        <i class="fa-solid fa-user-check"></i> A Quién va Dirigido
                    </label>
                    <input type="text" name="recipient_name" class="form-control input-field"
                           placeholder="Ej: Dirección General">
                </div>

                <!-- Observaciones -->
                <div class="form-group">
                    <label class="form-label">
                        <i class="fa-solid fa-note-sticky"></i> Observaciones / Notas
                    </label>
                    <textarea name="observation" class="form-control input-field" rows="4"
                              placeholder="Palabras clave, referencias o notas adicionales..."></textarea>
                </div>

                <!-- Contenedor para acciones de archivo (Eliminar solo si existe) -->
                <div class="form-group" id="modal_file_actions" style="display:flex; gap:0.5rem; align-items:center;">
                    <div style="margin-top:0.5rem;">
                        <button type="button" id="modal_delete_file_btn" title="Eliminar PDF"
                                class="btn btn-delete-action"
                                style="display:none;"><i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- FOOTER -->
            <div class="modal-footer modal-footer-spaced">
                <button type="button" class="btn-cancel" id="modal-cancel-btn">
                    Cerrar
                </button>
                <button type="submit" class="btn-save">
                    <i class="fas fa-save"></i> Guardar
                </button>
            </div>
        </form>

    </div>
</div>
