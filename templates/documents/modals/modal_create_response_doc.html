{% load static %}
<div class="modal-overlay hidden">
    <div class="modal-response-layout">
        <form id="createResponseDocForm" method="POST"
              action="{% url 'documents:save_response_document' procedure.id %}"
              data-procedure-id="{{ procedure.id }}">
            {% csrf_token %}

            <!-- 1. Encabezado Oficial Completo de lado a lado -->
            <div class="modal-header-medium response-header-bar">
                <div class="d-flex align-items-center gap-2">
                    <div class="header-icon-circle"><i class="fa-solid fa-file-pen"></i></div>
                    <div>
                        <h3 class="header-title">Responder Trámite: {{ procedure.code }}</h3>
                        <small class="text-white-50">{{ procedure.subject }}</small>
                    </div>
                </div>
                <button type="button" class="btn-close-circle" onclick="closeModal()" title="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- 2. Cuerpo en Dos Paneles Claros (Sidebar Lateral 300px + Área de Edición) -->
            <div class="response-body-grid">

                <!-- PANEL IZQUIERDO: Configuración, Firma y Botones -->
                <aside class="response-sidebar-panel">
                    <div class="response-sidebar-content">

                        <!-- Nivel de Emisión -->
                        <div class="form-group mb-3">
                            <label class="form-label" for="emissionLevelSelect">
                                Nivel de Emisión <span class="text-red">*</span>
                            </label>
                            <select name="emission_level" id="emissionLevelSelect" class="input-field">
                                {% for u in hierarchy_units %}
                                    <option value="UNIT_{{ u.id }}">Oficial: {{ u.name }}</option>
                                {% endfor %}
                                <option value="PERSONAL" selected>
                                    Personal: {{ user_full_name|default:request.user.get_full_name }}
                                </option>
                            </select>
                        </div>

                        <!-- Tipo de Documento -->
                        <div class="form-group mb-3">
                            <label class="form-label" for="docCategorySelect">
                                Tipo de Documento <span class="text-red">*</span>
                            </label>
                            <select name="category_id" id="docCategorySelect" class="input-field">
                                {% for t in doc_types %}
                                    <option value="{{ t.id }}" data-prefix="{{ t.code_prefix }}">{{ t.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Número de Radicado Resultante -->
                        <div class="form-group mb-3">
                            <label class="form-label" for="filingCodeInput">
                                Radicado Resultante
                            </label>
                            <input type="text" name="filing_code" id="filingCodeInput"
                                   class="input-field font-monospace fw-bold text-primary"
                                   value="{{ suggested_code }}" readonly>
                        </div>

                        <!-- Modo de Firma y Despacho -->
                        <div class="form-section-card p-3 mb-3">
                            <label class="form-label fw-bold small mb-2">
                                <i class="fa-solid fa-stamp me-1"></i> Modo de Despacho
                            </label>

                            <div class="d-flex flex-column gap-2">
                                <label class="form-check-label d-flex align-items-center gap-2 cursor-pointer small">
                                    <input type="radio" name="sign_mode" value="MANUAL" checked id="signModeManual">
                                    <span>Firma Física (Imprimir)</span>
                                </label>
                                <label class="form-check-label d-flex align-items-center gap-2 cursor-pointer small">
                                    <input type="radio" name="sign_mode" value="ELECTRONIC" id="signModeElectronic">
                                    <span>Firma Electrónica (.p12)</span>
                                </label>
                            </div>

                            <div id="certAuthBox" class="mt-2 hidden">
                                <input type="password" name="cert_password" id="id_cert_password"
                                       class="input-field small"
                                       placeholder="Contraseña del .p12">
                                <small class="text-muted d-block mt-1" style="font-size: 0.72rem;">
                                    <i class="fa-solid fa-shield-halved me-1"></i> Se valida en memoria
                                </small>
                            </div>
                        </div>

                    </div>

                    <!-- Botones de Acción al fondo del panel izquierdo -->
                    <div class="response-sidebar-actions">
                        <button type="submit" class="btn-dark-blue-rectangle w-100 justify-content-center"
                                id="btnSubmitResponseDoc">
                            <i class="fa-solid fa-paper-plane me-1"></i> Guardar y Despachar
                        </button>
                        <button type="button" class="btn-dark-blue-rectangle-outline w-100 justify-content-center"
                                onclick="closeModal()">
                            Cancelar
                        </button>
                    </div>
                </aside>

                <!-- PANEL DERECHO: Editor Visual Completo -->
                <main class="response-main-panel">
                    <label class="form-label mb-2 fw-bold" for="documentEditor">
                        <i class="fa-solid fa-align-left me-1"></i> Redacción del Documento <span
                            class="text-red">*</span>
                    </label>
                    <div class="response-ckeditor-container">
                        <textarea name="content_html" id="documentEditor">{{ default_template|safe }}</textarea>
                    </div>
                </main>

            </div>
        </form>
    </div>
</div>
