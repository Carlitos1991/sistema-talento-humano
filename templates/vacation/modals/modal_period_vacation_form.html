{% load static %}
<div class="modal-overlay">
    <div class="modal-container-medium">

        <!-- HEADER -->
        <div class="modal-header-medium">
            <div class="header-content-group">
                <div class="header-icon-circle">
                    <i class="fas fa-calendar-plus"></i>
                </div>
                <h3 class="header-title">{{ titulo }}</h3>
            </div>
            <button type="button" class="btn-close-circle" onclick="closeModal()" title="Cerrar">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="modal-body modal-body-custom">
            <form id="periodForm" action="{{ action_url }}" method="post" autocomplete="off">
                {% csrf_token %}

                <div class="form-section-card">
                    {% for field in form %}
                        <div class="form-group">
                            {% if field.name == 'is_active' %}
                                <label class="form-label">{{ field.label }}</label>
                                <label class="switch-wrapper">
                                    {{ field }}
                                    <span class="switch-circle"></span>
                                    <span class="switch-text">Activo</span>
                                </label>
                            {% else %}
                                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                                {{ field }}
                            {% endif %}

                            {% if field.help_text %}
                                <small class="form-hint">{{ field.help_text }}</small>
                            {% endif %}
                            <div class="invalid-feedback" id="error-{{ field.name }}"></div>
                        </div>
                    {% endfor %}
                </div>

                <!-- FOOTER -->
                <div class="modal-footer-fixed">
                    <button type="button" class="btn-default-outline" onclick="closeModal()">
                        <i class="fas fa-times me-1"></i> Cancelar
                    </button>
                    <button type="submit" class="btn-success">
                        <i class="fas fa-save me-1"></i> {% if is_edit %}Actualizar{% else %}Guardar{% endif %}
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>
