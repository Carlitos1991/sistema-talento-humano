{% load static %}
<div class="modal-container-medium shadow-card">
    <div class="modal-content">

        <!-- HEADER -->
        <div class="modal-header-refined">
            <div class="header-title-group">
                <div class="header-icon-circle">
                    <i class="fas fa-file-signature"></i>
                </div>
                <h2 class="header-title-text">{{ titulo }}</h2>
            </div>

            <!-- Botón X absoluto -->
            <button type="button" class="btn-close-modal js-close-modal" title="Cerrar">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form id="periodForm" action="{{ action_url }}" method="post" autocomplete="off">
            {% csrf_token %}

            <div class="modal-body">
                {% for field in form %}
                    <div class="form-group">
                        <!-- Lógica especial para el Checkbox -->
                        {% if field.name == 'is_active' %}
                            <label class="control-label">{{ field.label }}</label>
                            <div class="toggle-switch-wrapper">
                                <label class="switch">
                                    {{ field }}
                                    <span class="slider round"></span>
                                </label>
                                <span class="toggle-label-text">Activar / Desactivar</span>
                            </div>

                            <!-- Inputs normales (Texto, Selects, etc) -->
                        {% else %}
                            <label for="{{ field.id_for_label }}" class="control-label">{{ field.label }}</label>
                            {{ field }}
                        {% endif %}

                        {% if field.help_text %}
                            <small class="form-text text-muted">{{ field.help_text }}</small>
                        {% endif %}
                        <div class="field-errors" id="error-{{ field.name }}"></div>
                    </div>
                {% endfor %}
            </div>

            <!-- FOOTER: Botones centrados -->
            <div class="modal-footer-centered">
                <button type="button" class="btn-cancel js-close-modal">
                    <i class="fas fa-times-circle"></i> CANCELAR
                </button>
                <button type="submit" class="btn-save">
                    <i class="fas fa-check-circle"></i> {% if is_edit %}ACTUALIZAR{% else %}GUARDAR{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
