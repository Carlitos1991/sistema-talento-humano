{% load static %}
<div class="modal-overlay">
    <div class="modal-container-medium">
        <div class="modal-header-medium">
            <div class="header-content-group">
                <div class="header-icon-circle"><i class="fas fa-clock"></i></div>
                <h3 class="header-title">{{ titulo }}</h3>
            </div>
            <button type="button" class="btn-close-circle" onclick="closeModal()" title="Cerrar">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="modal-body modal-body-custom">
            <div class="alert alert-info">
                <i class="fas fa-circle-info"></i>
                <div>
                    <strong>Saldo Disponible:</strong> {{ active_balance.balance_days|floatformat:2 }} días.
                </div>
            </div>

            <form id="hourPermitForm" action="{{ action_url }}" method="post" autocomplete="off">
                {% csrf_token %}
                <div class="form-section-card">
                    <div class="grid-2-cols">
                        <div class="form-group">
                            <label class="form-label" for="id_start_date">Fecha *</label>
                            {{ form.start_date }}
                            <div class="invalid-feedback" id="error-start_date"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="id_start_time">Hora Inicio *</label>
                            {{ form.start_time }}
                            <div class="invalid-feedback" id="error-start_time"></div>
                        </div>
                    </div>
                    <div class="grid-2-cols mt-3">
                        <div class="form-group">
                            <label class="form-label" for="id_hours">Horas</label>
                            {{ form.hours }}
                            <div class="invalid-feedback" id="error-hours"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="id_minutes">Minutos</label>
                            {{ form.minutes }}
                            <div class="invalid-feedback" id="error-minutes"></div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer-fixed">
                    <button type="button" class="btn-dark-blue-rectangle-outline" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-success"><i class="fas fa-save me-1"></i> Solicitar Permiso
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
