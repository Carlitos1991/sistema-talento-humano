{% load static %}
<div class="modal-overlay">
    <div class="modal-container-small">

        <div class="modal-header-medium">
            <div class="header-content-group">
                <div class="header-icon-circle">
                    <i class="fas fa-file-pdf"></i>
                </div>
                <h3 class="header-title">Reporte de Permisos</h3>
            </div>
            <button type="button" class="btn-close-circle" onclick="closeModal()" title="Cerrar">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="modal-body modal-body-custom">
            <form action="{% url 'vacation:permit_report_pdf' employee.id %}" method="get" target="_blank">
                <div class="form-section-card">
                    <div class="form-group">
                        <label class="form-label">Fecha Inicio *</label>
                        <input type="date" name="start_date" id="reportStartDate" class="input-field" required>
                    </div>
                    <div class="form-group mt-3">
                        <label class="form-label">Fecha Fin *</label>
                        <input type="date" name="end_date" id="reportEndDate" class="input-field" required>
                    </div>
                </div>

                <div class="modal-footer-fixed">
                    <button type="button" class="btn-dark-blue-rectangle-outline" onclick="closeModal()">
                        <i class="fas fa-times me-1"></i> Cancelar
                    </button>
                    <button type="submit" class="btn-danger" onclick="setTimeout(closeModal, 500)">
                        <i class="fas fa-file-pdf me-1"></i> Generar PDF
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>
