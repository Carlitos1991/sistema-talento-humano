<div id="modalReportSpecific" class="modal-overlay hidden">
    <div class="modal-container-small">
        <div class="modal-header">
            <div class="header-content-group">
                <div class="header-icon-circle"><i class="fa-solid fa-calendar-check"></i></div>
                <h3 class="header-title">Reporte Específico</h3>
            </div>
            <button type="button" class="btn-close-circle" onclick="closeModal('modalReportSpecific')">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="modal-body-custom">
            <input type="hidden" id="specific_emp_id">

            <div class="alert alert-info mb-3">
                <i class="fa-solid fa-user me-2"></i>
                <div>
                    <div><strong>Empleado:</strong> <span id="specific_emp_name"></span></div>
                    <div class="small"><strong>Cédula:</strong> <span id="specific_emp_dni"></span></div>
                </div>
            </div>

            <div class="form-group">
                <label for="specific_start" class="form-label">Fecha Inicio</label>
                <input type="date" id="specific_start" class="input-field">
            </div>

            <div class="form-group mt-3">
                <label for="specific_end" class="form-label">Fecha Fin</label>
                <input type="date" id="specific_end" class="input-field">
            </div>
        </div>

        <div class="modal-footer-fixed">
            <button type="button" class="btn-white-rectangle" onclick="closeModal('modalReportSpecific')">
                Cancelar
            </button>
            <button type="button" id="btnDownloadSpecific" class="btn-blue-rectangle">
                <i class="fa-solid fa-file-pdf"></i> Generar
            </button>
        </div>
    </div>
</div>
