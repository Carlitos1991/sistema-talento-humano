<div class="modal-overlay">
    <div class="modal-container-medium">
        <form id="biometricTimeForm" action="/biometric/update-device-time/{{ device.id }}/" method="post"
              class="modal-form-layout">
            {% csrf_token %}

            <div class="modal-header-medium">
                <div class="header-content-group">
                    <div class="header-icon-circle">
                        <i class="fa-solid fa-clock"></i>
                    </div>
                    <h3 class="header-title">Sincronizar Hora: {{ device.name }}</h3>
                </div>
                <button type="button" class="btn-close-circle" onclick="closeModal()" title="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="modal-body modal-body-custom schedule-modal-body">
                <div class="form-section-card">
                    <div class="grid-2-cols text-center">
                        <div class="p-2 bg-light rounded border">
                            <span class="label-muted">HORA DEL SERVIDOR</span>
                            <h4 id="display-server-time" class="text-primary mb-0 font-monospace"><i
                                    class="fas fa-spinner fa-spin"></i></h4>
                        </div>
                        <div class="p-2 bg-light rounded border">
                            <span class="label-muted">HORA ACTUAL DEL RELOJ</span>
                            <h4 id="display-device-time" class="text-green mb-0 font-monospace"><i
                                    class="fas fa-spinner fa-spin"></i></h4>
                        </div>
                    </div>
                </div>

                <div class="form-section-card mt-3">
                    <div class="section-title">
                        <i class="fa-solid fa-gear text-green"></i> Modo de Sincronización
                    </div>
                    <div class="form-group">
                        <label class="d-flex align-items-center gap-2 cursor-pointer mb-2">
                            <input type="radio" name="mode" value="server" class="custom-radio" checked
                                   id="radio-mode-server">
                            <span class="fw-bold">Igualar inmediatamente con la hora del servidor</span>
                        </label>
                        <label class="d-flex align-items-center gap-2 cursor-pointer">
                            <input type="radio" name="mode" value="manual" class="custom-radio" id="radio-mode-manual">
                            <span>Ingresar fecha y hora manualmente</span>
                        </label>
                    </div>

                    <div class="form-group mt-2 hidden" id="manual-time-group">
                        <label class="form-label" for="manual_new_time">Fecha y Hora Manual *</label>
                        <input type="datetime-local" name="new_time" id="manual_new_time" class="form-control">
                    </div>
                </div>
            </div>

            <div class="modal-footer-fixed">
                <button type="button" class="btn-secondary-outline" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-blue-rectangle">
                    <i class="fa-solid fa-clock-rotate-left me-1"></i> APLICAR HORA
                </button>
            </div>
        </form>
    </div>
</div>
