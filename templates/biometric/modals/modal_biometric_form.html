<div class="modal-overlay">
    <div class="modal-container-medium">
        <form id="biometricForm" action="{{ action_url }}" method="post" autocomplete="off" class="modal-form-layout">
            {% csrf_token %}
            {% if is_edit %}<input type="hidden" name="id" value="{{ device.id }}">{% endif %}

            <!-- HEADER -->
            <div class="modal-header-medium">
                <div class="header-content-group">
                    <div class="header-icon-circle">
                        <i class="fa-solid fa-fingerprint"></i>
                    </div>
                    <h3 class="header-title">
                        {% if is_edit %}Editar Biométrico: {{ device.name }}{% else %}Nuevo Biométrico{% endif %}
                    </h3>
                </div>
                <button type="button" class="btn-close-circle" onclick="closeModal()" title="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- BODY -->
            <div class="modal-body modal-body-custom schedule-modal-body">
                <div class="form-section-card">
                    <div class="section-title">
                        <i class="fa-solid fa-network-wired text-green"></i> Parámetros de Red y Conexión
                    </div>
                    <div class="grid-2-cols">
                        <div class="form-group">
                            <label class="form-label" for="bio_name">Nombre del Dispositivo *</label>
                            <input type="text" name="name" id="bio_name" class="form-control" required
                                   placeholder="EJ: BIOMETRICO PLANTA BAJA" value="{{ device.name|default:'' }}">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="bio_location">Ubicación Física *</label>
                            <input type="text" name="location" id="bio_location" class="form-control" required
                                   placeholder="EJ: EDIFICIO CENTRAL - INGRESO"
                                   value="{{ device.location|default:'' }}">
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="grid-2-cols mt-3">
                        <div class="form-group">
                            <label class="form-label" for="bio_ip">Dirección IP *</label>
                            <input type="text" name="ip_address" id="bio_ip" class="form-control" required
                                   placeholder="192.168.1.201" value="{{ device.ip_address|default:'' }}">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="bio_port">Puerto *</label>
                            <input type="number" name="port" id="bio_port" class="form-control" required
                                   value="{{ device.port|default:'4370' }}">
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>
                </div>

                <div class="form-section-card mt-3">
                    <div class="section-title">
                        <i class="fa-solid fa-microchip text-green"></i> Datos de Hardware (Opcional)
                    </div>
                    <div class="grid-2-cols">
                        <div class="form-group">
                            <label class="form-label" for="bio_serial">Número de Serie</label>
                            <input type="text" name="serial_number" id="bio_serial" class="form-control"
                                   placeholder="Se autodetecta al probar conexión"
                                   value="{{ device.serial_number|default:'' }}">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="bio_model">Modelo</label>
                            <input type="text" name="model_name" id="bio_model" class="form-control"
                                   placeholder="EJ: ZKTeco SilkBio-101TC" value="{{ device.model_name|default:'' }}">
                        </div>
                    </div>
                </div>

                <div class="form-section-card mt-3">
                    <div class="form-group mb-0">
                        <label class="form-label">Estado del Dispositivo</label>
                        <input type="checkbox" name="is_active" id="bio_is_active" class="switch-input switch-green"
                               value="true" {% if not device or device.is_active %}checked{% endif %}>
                        <label class="switch-wrapper" for="bio_is_active">
                            <span class="switch-circle"></span>
                            <span class="switch-text">Dispositivo Activo</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- FOOTER -->
            <div class="modal-footer-fixed">
                <button type="button" class="btn-secondary-outline" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-success">
                    <i class="fas fa-save me-1"></i> {% if is_edit %}ACTUALIZAR{% else %}GUARDAR{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
