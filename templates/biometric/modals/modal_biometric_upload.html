<div class="modal-overlay">
    <div class="modal-container-medium">
        <form id="biometricUploadForm" action="/biometric/upload-file/{{ device.id }}/" method="post"
              enctype="multipart/form-data" class="modal-form-layout">
            {% csrf_token %}

            <div class="modal-header-medium">
                <div class="header-content-group">
                    <div class="header-icon-circle">
                        <i class="fa-brands fa-usb"></i>
                    </div>
                    <h3 class="header-title">Carga Manual USB: {{ device.name }}</h3>
                </div>
                <button type="button" class="btn-close-circle" onclick="closeModal()" title="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="modal-body modal-body-custom schedule-modal-body">
                <div class="form-section-card">
                    <div class="section-title">
                        <i class="fa-solid fa-file-import text-green"></i> Archivo de Marcaciones (DAT / TXT)
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="usb_file">Seleccione el archivo exportado desde la memoria USB
                            *</label>
                        <input type="file" name="file" id="usb_file" class="form-control" accept=".dat,.txt" required>
                        <span class="form-hint">Formato tabular nativo ZKTeco (PIN, Timestamp, etc.)</span>
                    </div>
                </div>

                <div class="alert alert-info mt-3">
                    <i class="fa-solid fa-circle-info"></i>
                    <div>El sistema ignorará marcaciones duplicadas que ya se encuentren registradas para cada
                        empleado.
                    </div>
                </div>
            </div>

            <div class="modal-footer-fixed">
                <button type="button" class="btn-secondary-outline" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-success">
                    <i class="fa-solid fa-cloud-arrow-up me-1"></i> PROCESAR Y GUARDAR
                </button>
            </div>
        </form>
    </div>
</div>
