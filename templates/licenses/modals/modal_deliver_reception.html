{% load static %}
<div class="modal-overlay" id="deliverReceptionModal">
    <div class="modal-container-medium">
        <form action="{% url 'licenses:reception_deliver_save' reception.id %}" method="POST" id="deliverReceptionForm"
              onsubmit="submitDeliverReceptionForm(event)">
            {% csrf_token %}
            <div class="modal-header-medium">
                <h3 class="header-title">
                    <i class="fas fa-paper-plane"></i> Remitir / Entregar Expediente (#REC-{{ reception.id }})
                </h3>
                <button type="button" class="btn-close-circle" onclick="closeModal()"><i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body-custom modal-body-padded">
                <div class="form-group">
                    <label class="form-label">Entregar a (Servidor / Analista Destino) <span
                            class="text-red">*</span></label>
                    <select name="delivered_to" class="input-field select2-modal" required>
                        <option value="">-- Seleccione el funcionario receptor --</option>
                        {% for u in users %}
                            <option value="{{ u.id }}">{{ u.last_name }} {{ u.first_name }} ({{ u.username }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group field-group-compact field-spaced">
                    <label class="form-label">Observaciones de Entrega</label>
                    <textarea name="delivery_observation" class="input-field" rows="3"
                              placeholder="Notas adicionales al entregar la documentación física..."></textarea>
                </div>
            </div>
            <div class="modal-footer-fixed">
                <button type="button" class="btn-dark-blue-rectangle-outline" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-dark-blue-rectangle">
                    <i class="fas fa-print"></i> Entregar y Generar Acta PDF
                </button>
            </div>
        </form>
    </div>
</div>
