{% load static %}
<div class="modal-overlay" id="receptionModal">
    <div class="modal-container-medium">
        <form action="{% url 'licenses:reception_save' %}" method="POST" id="receptionForm"
              onsubmit="submitAjaxForm(event)">
            {% csrf_token %}

            <div class="modal-header-medium">
                <div class="header-content-group">
                    <div class="header-icon-circle">
                        <i class="fa-solid fa-inbox"></i>
                    </div>
                    <h3 class="header-title">Nueva Recepción de Licencia</h3>
                </div>
                <button type="button" class="btn-close-circle" onclick="closeModal()" title="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="modal-body-custom">
                <!-- 1. DATOS DE IDENTIFICACIÓN -->
                <div class="form-section-card mb-3">
                    <div class="section-title mb-2">
                        <i class="fas fa-user-check text-primary me-1"></i> Datos del Servidor y Tipo de Solicitud
                    </div>
                    <div class="grid-2-cols">
                        <div class="form-group">
                            <label class="form-label">Servidor Municipal <span class="text-danger">*</span></label>
                            <select name="employee" id="id_reception_employee" class="input-field select2-modal"
                                    required>
                                <option value="">-- Seleccione el servidor --</option>
                                {% for emp in employees %}
                                    <option value="{{ emp.id }}">
                                        {{ emp.person.last_name }} {{ emp.person.first_name }}
                                        ({{ emp.person.document_number }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Tipo de Licencia <span class="text-danger">*</span></label>
                            <select name="license_type" id="id_reception_license_type" class="input-field select2-modal"
                                    required>
                                <option value="">-- Seleccione tipo de licencia --</option>
                                {% for ltype in license_types %}
                                    <option value="{{ ltype.id }}">{{ ltype.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="grid-2-cols mt-2">
                        <div class="form-group">
                            <label class="form-label">Inicio de licencia <span class="text-danger">*</span></label>
                            <input type="date" name="license_start_date" class="input-field form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Fin de licencia <span class="text-danger">*</span></label>
                            <input type="date" name="license_end_date" class="input-field form-control" required>
                        </div>
                    </div>
                </div>

                <!-- 2. CHECKLIST REQUISITOS -->
                <div class="form-section-card mb-3">
                    <div class="section-title mb-2">
                        <i class="fas fa-tasks text-primary me-1"></i> Verificación de Anexos / Documentos Requeridos
                    </div>
                    <div id="requirements_checklist_container" class="reception-requirements-container">
                        <span class="text-muted small">Seleccione un tipo de licencia para desplegar los anexos requeridos.</span>
                    </div>
                </div>

                <!-- 3. OBSERVACIONES -->
                <div class="form-section-card">
                    <div class="form-group mb-0">
                        <label class="form-label">Observaciones de Recepción</label>
                        <textarea name="observations" class="input-field form-control" rows="2"
                                  placeholder="Detalle de observaciones sobre el estado físico de los documentos presentados en ventanilla..."></textarea>
                    </div>
                </div>
            </div>

            <div class="modal-footer-fixed">
                <button type="button" class="btn-dark-blue-rectangle-outline" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-dark-blue-rectangle">
                    <i class="fas fa-check-circle me-1"></i> Confirmar Recepción
                </button>
            </div>
        </form>
    </div>
</div>
