{% load static %}
<div class="modal-overlay" id="receptionModal">
    <div class="modal-container-medium">
        <form action="{% url 'licenses:reception_save' %}" method="POST" id="receptionForm" novalidate>
            {% csrf_token %}

            <div class="modal-header-medium">
                <div class="header-content-group">
                    <div class="header-icon-circle">
                        <i class="fa-solid fa-inbox"></i>
                    </div>
                    <h3 class="header-title">Nueva Recepción de Licencia</h3>
                </div>
                <button type="button" class="btn-close-circle" onclick="closeModal()" title="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="modal-body-custom">
                <div id="receptionFormAlert" class="alert-box-error hidden"></div>

                <div class="form-section-card">
                    <div class="section-title">
                        <i class="fas fa-user-check text-primary"></i> Datos del Servidor y Tipo de Solicitud
                    </div>
                    <div class="grid-2-cols">
                        <div class="form-group">
                            <label class="form-label">Servidor Municipal <span class="text-red">*</span></label>
                            <select name="employee" id="id_reception_employee" class="input-field select2-modal"
                                    required>
                                <option value="">-- Seleccione el servidor --</option>
                                {% for emp in employees %}
                                    <option value="{{ emp.id }}">
                                        {{ emp.person.last_name }} {{ emp.person.first_name }}
                                        ({{ emp.person.document_number }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Tipo de Licencia <span class="text-red">*</span></label>
                            <select name="license_type" id="id_reception_license_type" class="input-field select2-modal"
                                    required>
                                <option value="">-- Seleccione tipo de licencia --</option>
                                {% for ltype in license_types %}
                                    <option value="{{ ltype.id }}">{{ ltype.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="grid-2-cols field-spaced">
                        <div class="form-group">
                            <label class="form-label">Inicio de licencia <span class="text-red">*</span></label>
                            <input type="date" name="license_start_date" class="input-field" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Número de días <span class="text-red">*</span></label>
                            <input type="number" name="license_days" class="input-field" min="0" step="1" required>
                            <small class="form-help-muted">Ingrese 0 si la licencia es indefinida.</small>
                        </div>
                    </div>
                    <input type="hidden" name="license_end_date" id="license_end_date">
                </div>

                <div class="form-section-card section-spaced">
                    <div class="section-title">
                        <i class="fas fa-tasks text-primary"></i> Verificación de Anexos / Documentos Requeridos
                    </div>
                    <div class="form-group">
                        <label class="form-label">Documento habilitante <span class="text-red">*</span></label>
                        <input type="text" name="supporting_document" class="input-field"
                               maxlength="255" required
                               placeholder="Ingrese el documento que habilita la licencia">
                    </div>
                    <div id="requirements_checklist_container" class="reception-requirements-container field-spaced">
                        <div class="muted-note-inline">Seleccione un tipo de licencia para desplegar los anexos
                            requeridos.
                        </div>
                    </div>
                </div>

                <div class="form-section-card section-spaced">
                    <div class="form-group field-group-compact">
                        <label class="form-label">Observaciones de Recepción</label>
                        <textarea name="observations" class="input-field" rows="2"
                                  placeholder="Detalle de observaciones sobre el estado físico de los documentos presentados en ventanilla..."></textarea>
                    </div>
                </div>
            </div>

            <div class="modal-footer-fixed">
                <button type="button" class="btn-dark-blue-rectangle-outline" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-dark-blue-rectangle">
                    <i class="fas fa-check-circle"></i> Confirmar Recepción
                </button>
            </div>
        </form>
    </div>
</div>
