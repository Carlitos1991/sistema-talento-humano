{% load static %}
<div class="modal-overlay" id="bulkDeliverReceptionModal">
    <div class="modal-container-medium">
        <form action="{% url 'licenses:reception_bulk_deliver_save' %}" method="POST"
              id="bulkDeliverReceptionForm" onsubmit="submitBulkDeliverReceptionForm(event)">
            {% csrf_token %}
            <input type="hidden" name="reception_ids" id="bulk-reception-ids">
            <div class="modal-header-medium">
                <h3 class="header-title"><i class="fas fa-paper-plane me-2"></i> Remitir Recepciones</h3>
                <button type="button" class="btn-close-circle" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body-custom p-3">
                <p class="bulk-deliver-summary"><i class="fas fa-check-circle me-1"></i>
                    Se remitirán <strong id="bulk-reception-count">0</strong> recepciones aprobadas.
                </p>
                <div class="form-group mb-3">
                    <label class="form-label">Entregar a (Servidor / Analista Destino) <span class="text-danger">*</span></label>
                    <select name="delivered_to" class="input-field select2-modal" required>
                        <option value="">-- Seleccione el funcionario receptor --</option>
                        {% for u in users %}
                            <option value="{{ u.id }}">{{ u.last_name }} {{ u.first_name }} ({{ u.username }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group mb-0">
                    <label class="form-label">Observaciones de Entrega</label>
                    <textarea name="delivery_observation" class="input-field form-control" rows="3"
                              placeholder="Notas adicionales al entregar la documentación física..."></textarea>
                </div>
            </div>
            <div class="modal-footer-fixed">
                <button type="button" class="btn-dark-blue-rectangle-outline" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-dark-blue-rectangle"><i class="fas fa-paper-plane me-1"></i> Remitir seleccionadas</button>
            </div>
        </form>
    </div>
</div>
