{% load static %}
<div class="modal-overlay" id="requirementSubmodal">
    <div class="modal-container-small">
        <form action="{% url 'licenses:requirement_save_ajax' %}" method="POST" id="requirementForm"
              onsubmit="submitRequirementFormAjax(event)">
            {% csrf_token %}
            <div class="modal-header-medium">
                <h3 class="header-title"><i class="fas fa-folder-plus"></i> Nuevo Requisito / Anexo</h3>
                <button type="button" class="btn-close-circle" onclick="closeSubmodal()"><i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body-custom modal-body-padded">
                <div class="form-group">
                    <label class="form-label" for="{{ form.name.id_for_label }}">
                        Nombre del Anexo / Requisito <span class="text-red">*</span>
                    </label>
                    {{ form.name }}
                </div>
                <div class="switch-row-inline field-spaced">
                    {{ form.is_mandatory }}
                    <label class="switch-wrapper" for="{{ form.is_mandatory.id_for_label }}">
                        <div class="switch-circle"></div>
                        <span class="switch-text">Es documento obligatorio</span>
                    </label>
                </div>
            </div>
            <div class="modal-footer-fixed">
                <button type="button" class="btn-dark-blue-rectangle-outline" onclick="closeSubmodal()">Cancelar
                </button>
                <button type="submit" class="btn-dark-blue-rectangle"><i class="fas fa-save"></i> Guardar</button>
            </div>
        </form>
    </div>
</div>
