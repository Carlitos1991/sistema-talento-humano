<div class="custom-modal-main">
    <div class="modal-header-refined">
        <div class="header-content-group">
            <div class="header-icon-circle"><i class="fas fa-user-tie"></i></div>
            <h3 class="header-title-main">Asignar Jefe Inmediato</h3>
        </div>
        <button type="button" class="btn-close-modal-refined" onclick="closeDynamicModal()">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <form id="assignBossForm" data-unit-id="{{ unit.id }}" method="post" onsubmit="submitAssignBoss(); return false;">
        {% csrf_token %}
        <div class="modal-body-custom">
            <div class="form-section-card">
                <div class="row g-3">
                    <div class="col-12 form-group">
                        <div class="alert alert-info py-2">
                            <small><i class="fas fa-info-circle"></i> Unidad: <strong>{{ unit.name }}</strong></small>
                        </div>
                        <label class="form-label fw-bold">Funcionario</label>
                        {{ form.boss }}
                        <div class="form-text text-muted">Puede buscar por nombre o número de cédula. No se muestran ex-empleados.</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal-footer-fixed">
            <button type="button" class="btn-cancel" onclick="closeAssignModal()">Cancelar</button>
            <button type="button" class="btn-save" onclick="submitAssignBoss()"><i class="fas fa-save"></i> Guardar Asignación</button>
        </div>
    </form>
</div>
