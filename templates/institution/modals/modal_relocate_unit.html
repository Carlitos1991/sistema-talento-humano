<div id="relocate-modal-container" class="modal-overlay hidden">
    <div class="modal-container-small">
        <form id="relocateForm">
            {% csrf_token %}

            <div class="modal-header-medium">
                <h3 class="header-title">
                    <i class="fa-solid fa-arrows-alt-v me-2"></i>
                    <span>Reubicar Unidad</span>
                </h3>
                <button type="button" class="btn-close-circle" onclick="closeModal('relocate-modal-container')">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="modal-body">
                <div class="form-section-card">
                    <div class="form-group mb-3">
                        <label class="form-label">Unidad a Reubicar</label>
                        <input type="text" class="form-control" id="unitNameField" readonly disabled>
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label">Padre Actual</label>
                        <input type="text" class="form-control" id="currentParentField" readonly disabled>
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label">Nueva Unidad Padre <span class="text-danger">*</span></label>
                        <select id="id_new_parent" class="form-control" required>
                            <option value="">--- Cargando padres disponibles ---</option>
                        </select>
                        <div class="text-error" id="errorParent"></div>
                    </div>

                    <div id="errorContainer" class="alert alert-danger mb-3" style="display: none;"></div>
                </div>
            </div>

            <div class="modal-footer-medium">
                <button type="button" class="btn-default-outline" onclick="closeModal('relocate-modal-container')">
                    Cancelar
                </button>
                <button type="submit" class="btn-dark-blue-rectangle">
                    <i class="fa-solid fa-check me-1"></i> Reubicar
                </button>
            </div>
        </form>
    </div>
</div>
