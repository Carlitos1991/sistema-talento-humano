<div id="relocate-modal-container" class="custom-modal-overlay" >
    <div class="custom-modal-dialog">
        <form id="relocateForm" >
            {% csrf_token %}

            <div class="modal-header-medium modal-header-gradient">
                <h3 class="modal-title text-white">
                    <i class="fa-solid fa-arrows-alt-v me-2"></i> Reubicar Unidad
                </h3>
                <button type="button" class="btn-close-modal text-white-opacity" id="closeModalBtn" onclick="closeRelocateModal(); return false;">&times;</button>
            </div>

            <div class="modal-body-content modal-body-custom">
                <!-- Info removed as requested: previously showed 'Selecciona una nueva unidad padre...' -->

                <div class="form-section-card">
                    <!-- NOMBRE DE LA UNIDAD (Read-only) -->
                    <div class="form-group mb-3">
                        <label class="form-label">Unidad a Reubicar</label>
                        <input type="text" class="input-field" id="unitNameField" readonly disabled>
                    </div>

                    <!-- PADRE ACTUAL (Read-only) -->
                    <div class="form-group mb-3">
                        <label class="form-label">Padre Actual</label>
                        <input type="text" class="input-field" id="currentParentField" readonly disabled>
                    </div>

                    <!-- NUEVO PADRE (Select) -->
                    <div class="form-group mb-3">
                        <label class="form-label">Nueva Unidad Padre <span class="text-danger">*</span></label>
                        <select id="id_new_parent" class="input-field" required>
                            <option value="">--- Cargando padres disponibles ---</option>
                        </select>
                        <div class="text-error" id="errorParent"></div>
                    </div>

                    <div id="errorContainer" class="alert alert-danger mb-3" style="display: none;"></div>
                </div>
            </div>

            <div class="modal-footer-medium modal-footer-spaced">
                <button type="button" class="btn-cancel" id="cancelBtn" onclick="closeRelocateModal(); return false;">Cancelar</button>
                <button type="submit" class="btn-save shadow-md">
                    <i class="fa-solid fa-check me-2"></i> Reubicar
                </button>
            </div>
        </form>
    </div>
</div>

<script>

</script>
