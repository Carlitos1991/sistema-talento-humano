<div class="modal-overlay hidden">
    <div class="modal-container-small">
        <form id="unitForm" method="post" action="
                
                {% if form.instance.pk %}{% url 'institution:unit_update' form.instance.pk %}{% else %}{% url 'institution:unit_create' %}{% endif %}"
              onsubmit="submitAjaxForm(event);">
            {% csrf_token %}
            <div>
                {{ form.level }}
                {{ form.parent }}
                {{ form.boss }}
                {{ form.is_active }}
            </div>

            <div class="modal-header">
                <h3 class="header-title">
                    <i class="fa-solid fa-layer-group me-2"></i>
                    <span>Estructura Organizacional</span>
                </h3>
                <button type="button" class="btn-close-circle" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="modal-body-content modal-body-custom">
                <div class="form-section-card">
                    <!-- CÓDIGO -->
                    <div class="form-group mb-3">
                        <label class="form-label">
                            Código <span class="text-danger">*</span>
                            <small class="text-muted ms-1">(generado automáticamente)</small>
                        </label>
                        {{ form.code }}
                    </div>

                    <!-- NOMBRE -->
                    <div class="form-group mb-3">
                        <label class="form-label">
                            Nombre de la Unidad <span class="text-danger">*</span>
                        </label>
                        {{ form.name }}
                    </div>

                    <div class="row g-3">
                        <!-- UBICACIÓN -->
                        <div class="col-md-6 form-group">
                            <label class="form-label">Ubicación</label>
                            {{ form.address }}
                        </div>
                        <!-- TELÉFONO -->
                        <div class="col-md-6 form-group">
                            <label class="form-label">Teléfono</label>
                            {{ form.phone }}
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer-medium modal-footer-spaced">
                <button type="button" class="btn-default-outline" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-default">
                    <i class="fas fa-save me-1"></i> Guardar
                </button>
            </div>
        </form>
    </div>
</div>
