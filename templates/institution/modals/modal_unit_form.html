<!-- apps/institution/templates/institution/modals/modal_unit_form.html -->

<div id="unit-modal-app" v-cloak>
    <div class="modal-overlay" :class="{ 'hidden': !isVisible }" role="dialog">
        <div class="modal-container-medium animate-scale-in" style="max-width: 600px;">
            <form @submit.prevent="submitForm" id="unitForm">
                {% csrf_token %}
                <div style="display:none !important; position:absolute; visibility:hidden;">
                    {{ form.level }}
                    {{ form.parent }}
                </div>

                <div class="modal-header-medium modal-header-gradient">
                    <h3 class="modal-title text-white">
                        <i class="fa-solid fa-sitemap me-2"></i> Estructura Organizacional
                        <span v-text="modalTitle"> </span>
                    </h3>
                    <button type="button" class="btn-close-modal text-white-opacity"
                            @click="closeModal">&times;
                    </button>
                </div>

                <div class="modal-body-content modal-body-custom">

                    <!-- Errores generales -->
                    <div v-if="errors.__all__" class="alert alert-danger mb-3">
                        <span v-for="err in errors.__all__">[[ err ]]</span>
                    </div>

                    <div class="form-section-card">

                        <!-- CÓDIGO -->
                        <div class="form-group mb-3">
                            <label class="form-label">
                                Código <span class="text-danger">*</span>
                                <small class="text-muted ms-1">(generado automáticamente)</small>
                            </label>
                            {{ form.code }}
                            <div class="text-error" v-if="errors.code">[[ errors.code[0] ]]</div>
                        </div>

                        <!-- NOMBRE -->
                        <div class="form-group mb-3">
                            <label class="form-label">
                                Nombre de la Unidad <span class="text-danger">*</span>
                            </label>
                            {{ form.name }}
                            <div class="text-error" v-if="errors.name">[[ errors.name[0] ]]</div>
                        </div>

                        <div class="row g-3">
                            <!-- UBICACIÓN -->
                            <div class="col-md-6 form-group">
                                <label class="form-label">Ubicación</label>
                                {{ form.address }}
                                <div class="text-error" v-if="errors.address">[[ errors.address[0] ]]</div>
                            </div>
                            <!-- TELÉFONO -->
                            <div class="col-md-6 form-group">
                                <label class="form-label">Teléfono</label>
                                {{ form.phone }}
                                <div class="text-error" v-if="errors.phone">[[ errors.phone[0] ]]</div>
                            </div>
                        </div>

                        <!-- ESTADO — solo visible al editar -->
                        <div class="form-group mt-3" v-if="isEditing">
                            <div class="form-check form-switch">
                                {{ form.is_active }}
                                <label class="form-check-label"
                                       for="{{ form.is_active.id_for_label }}">
                                    Estado (Activo/Inactivo)
                                </label>
                            </div>
                            <div class="text-error" v-if="errors.is_active">
                                [[ errors.is_active[0] ]]
                            </div>
                        </div>

                    </div>
                </div>

                <div class="modal-footer-medium modal-footer-spaced">
                    <button type="button" class="btn-cancel" @click="closeModal">
                        Cancelar
                    </button>
                    <button type="submit" class="btn-save shadow-md">
                        <i class="fa-solid fa-save me-2"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
