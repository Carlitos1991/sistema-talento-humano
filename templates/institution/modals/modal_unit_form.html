<!-- apps/institution/templates/institution/modals/modal_unit_form.html -->

<div id="unit-modal-app" v-cloak>
    <div class="modal-overlay" :class="{ 'hidden': !isVisible }" role="dialog">
        <div class="modal-container-medium animate-scale-in" style="max-width: 600px;">
            <form @submit.prevent="submitForm" id="unitForm">
                {% csrf_token %}

                <!-- Campos Ocultos Inyectados -->
                {{ form.level }}
                {{ form.parent }}
                {{ form.boss }}

                <div class="modal-header-medium modal-header-gradient">
                    <h3 class="modal-title text-white">
                        <i class="fa-solid fa-sitemap me-2"></i>
                        <span v-text="isEditing ? 'Editar Unidad' : 'Nueva Unidad Administrativa'"></span>
                    </h3>
                    <button type="button" class="btn-close-modal text-white-opacity" @click="closeModal">&times;
                    </button>
                </div>

                <div class="modal-body-content modal-body-custom">
                    <!-- Errores Generales -->
                    <div v-if="errors.__all__" class="alert alert-danger mb-3">
                        <span v-for="err in errors.__all__">[[ err ]]</span>
                    </div>

                    <div class="form-section-card">
                        <!-- Campo CODIGO (Auto) -->
                        <div class="form-group mb-3">
                            <label class="form-label">Código / Partida <span class="text-danger">*</span></label>
                            {{ form.code }}
                            <div class="text-error" v-if="errors.code">[[ errors.code[0] ]]</div>
                            <small class="form-hint" v-if="!isEditing">
                                Generado automáticamente según la jerarquía actual.
                            </small>
                        </div>

                        <!-- Campo NOMBRE -->
                        <div class="form-group mb-3">
                            <label class="form-label">Nombre de la Unidad <span class="text-danger">*</span></label>
                            {{ form.name }}
                            <div class="text-error" v-if="errors.name">[[ errors.name[0] ]]</div>
                        </div>

                        <div class="row g-3">
                            <!-- Campo UBICACIÓN -->
                            <div class="col-md-6 form-group">
                                <label class="form-label">Ubicación</label>
                                {{ form.address }}
                                <div class="text-error" v-if="errors.address">[[ errors.address[0] ]]</div>
                            </div>
                            <!-- Campo TELÉFONO -->
                            <div class="col-md-6 form-group">
                                <label class="form-label">Teléfono</label>
                                {{ form.phone }}
                                <div class="text-error" v-if="errors.phone">[[ errors.phone[0] ]]</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer-medium modal-footer-spaced">
                    <button type="button" class="btn-cancel" @click="closeModal">Cancelar</button>
                    <button type="submit" class="btn-save shadow-md">
                        <i class="fa-solid fa-save me-2"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
