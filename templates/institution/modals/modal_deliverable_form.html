<div class="modal-overlay hidden">
    <div class="modal-container-medium">
        <form action="{{ request.path }}" method="POST" id="deliverableForm" onsubmit="submitAjaxForm(event)">
            {% csrf_token %}
            <div class="modal-header-medium">
                <h3 class="header-title">
                    <i class="fa-solid fa-box me-2"></i>
                    <span>{% if object %}Editar Entregable{% else %}Nuevo Entregable{% endif %}</span>
                </h3>
                <button type="button" class="btn-close-circle" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="modal-body">
                {% if form.non_field_errors %}
                    <div class="alert alert-danger mb-3">
                        {% for error in form.non_field_errors %}
                            {{ error }}
                        {% endfor %}
                    </div>
                {% endif %}

                <div class="form-section-card">
                    <div class="form-group mb-3">
                        <label class="form-label" for="id_name">Nombre <span class="text-danger">*</span></label>
                        <input type="text" name="name" id="id_name" class="form-control"
                               value="{{ form.name.value|default:'' }}" required>
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label" for="id_description">Descripción</label>
                        <textarea name="description" id="id_description" class="form-control"
                                  rows="4">{{ form.description.value|default:'' }}</textarea>
                        <div class="invalid-feedback"></div>
                    </div>
                </div>
            </div>

            <div class="modal-footer-medium">
                <button type="button" class="btn-default-outline" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-dark-blue-rectangle">
                    <i class="fas fa-save me-1"></i> {% if object %}Actualizar{% else %}Guardar{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
