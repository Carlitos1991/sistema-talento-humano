<!-- apps/person/templates/person/modals/modal_person_advanced_search.html -->
<div id="modalAdvancedSearch" class="modal-overlay hidden" onclick="closeModalOnOutsideClick(event)">
    <div class="modal-container-search" onclick="event.stopPropagation()">
        <div class="modal-header-search">
            <div class="header-content">
                <i class="fas fa-search-plus"></i>
                <h3>Búsqueda Avanzada</h3>
            </div>
            <button type="button" class="close-modal-btn-search" onclick="toggleSearchModal(false)">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body-search">
            <form id="advancedSearchForm" onsubmit="event.preventDefault();">
                <div class="form-grid-search">
                    <!-- Columna 1 -->
                    <div class="form-column">
                        <div class="form-group-search">
                            <label class="form-label-search">
                                <i class="fas fa-id-card"></i> Cédula
                            </label>
                            <input type="text" 
                                   name="cedula" 
                                   class="input-field-search" 
                                   placeholder="Número de cédula"
                                   maxlength="13">
                        </div>

                        <div class="form-group-search">
                            <label class="form-label-search">
                                <i class="fas fa-user"></i> Nombres / Apellidos
                            </label>
                            <input type="text" 
                                   name="nombres" 
                                   class="input-field-search"
                                   placeholder="Buscar por nombre...">
                        </div>

                        <div class="form-group-search">
                            <label class="form-label-search">
                                <i class="fas fa-heart"></i> Estado Civil
                            </label>
                            <select name="marital_status" id="civilStatusSearchSelect" class="input-field-search">
                                <option value="">-- Seleccione --</option>
                                {% for ms in marital_status_list %}
                                    <option value="{{ ms.id }}">{{ ms.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Columna 2 -->
                    <div class="form-column">
                        <div class="form-group-search">
                            <label class="form-label-search">
                                <i class="fas fa-venus-mars"></i> Género
                            </label>
                            <select name="gender" id="genderSearchSelect" class="input-field-search">
                                <option value="">-- Seleccione --</option>
                                {% for gender in gender_list %}
                                    <option value="{{ gender.id }}">{{ gender.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group-search">
                            <label class="form-label-search">
                                <i class="fas fa-building"></i> Unidad Administrativa
                            </label>
                            <select name="area" id="areaSearchSelect" class="input-field-search">
                                <option value="">-- Seleccione --</option>
                                {% for area in areas_list %}
                                    <option value="{{ area.id }}">{{ area.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group-search">
                            <label class="form-label-search">
                                <i class="fas fa-user-tag"></i> Estado Laboral
                            </label>
                            <select name="status" id="statusSearchSelect" class="input-field-search">
                                <option value="">-- Seleccione --</option>
                                {% for st in status_list %}
                                    <option value="{{ st.id }}">{{ st.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer-search">
            <button type="button" class="btn-search btn-secondary-search" onclick="resetAdvancedSearch()">
                <i class="fas fa-eraser"></i> Limpiar
            </button>
            <button type="button" class="btn-search btn-primary-search" onclick="applyAdvancedSearch()">
                <i class="fas fa-search"></i> Buscar
            </button>
        </div>
    </div>
</div>
