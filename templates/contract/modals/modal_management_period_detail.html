{% load static %}
<div id="detailModalOverlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-container-xl shadow-card animate-scale-in">
        <button type="button" id="btn-close-detail-top" class="btn-close-circle">
            <i class="fas fa-times"></i>
        </button>

        <div class="modal-header-refined">
            <div class="header-content-group">
                <div class="header-icon-circle"><i class="fas fa-folder-open"></i></div>
                <div>
                    <h2 class="header-title-main">Expediente de Gestión Laboral</h2>
                    <p class="text-white-opacity small mb-0">
                        Documento: <strong id="detail-document-number">-</strong>
                    </p>
                </div>
            </div>
            <div class="ms-auto me-5">
                <button type="button" id="btn-detail-edit" class="btn-views-action hidden" title="Modificar Expediente">
                    <i class="fas fa-edit"></i>
                </button>
            </div>
        </div>

        <div class="modal-body-scrolled">
            <!-- Banner Superior del Empleado -->
            <div class="inherited-info-card mb-4" id="detail-banner-card">
                <div class="d-flex align-items-center w-100">
                    <img id="detail-employee-photo" src="{% static 'img/avatar-placeholder.png' %}"
                         class="person-avatar me-3" alt="Foto">
                    <div class="employee-main-data">
                        <h4 class="mb-1 text-white font-weight-800" id="detail-employee-name">-</h4>
                        <span class="status-badge general" id="detail-status-badge">-</span>
                    </div>

                    <div class="budget-inherited-box ms-auto text-end">
                        <small class="text-white-opacity d-block mb-1" id="detail-budget-title">PARTIDA
                            PRESUPUESTARIA</small>
                        <strong class="text-accent d-block period-budget-code-text" id="detail-budget-number">-</strong>
                        <span class="d-block text-white font-weight-600" id="detail-position-name">-</span>
                    </div>
                </div>
            </div>

            <div class="grid-2-cols">
                <!-- Columna 1: Información Administrativa -->
                <div class="section-card-standard border-left-primary">
                    <h6 class="section-title"><i class="fas fa-file-invoice text-primary"></i> Información de Respaldo
                    </h6>
                    <div class="audit-data-row"><span>Unidad:</span> <strong id="detail-unit-name">-</strong></div>
                    <div class="audit-data-row"><span>Memo Necesidad:</span> <strong id="detail-memo">-</strong></div>
                    <div class="audit-data-row"><span>Cert. Presupuestaria:</span> <strong id="detail-cert">-</strong>
                    </div>
                    <div class="audit-data-row"><span>Lugar de Trabajo:</span> <strong id="detail-workplace">-</strong>
                    </div>
                </div>

                <!-- Columna 2: Vigencia y Remuneración -->
                <div class="section-card-standard">
                    <h6 class="section-title"><i class="fas fa-calendar-alt text-primary"></i> Vigencia y Jornada</h6>
                    <div class="audit-data-row"><span>Tipo Contrato:</span> <strong id="detail-contract-type">-</strong>
                    </div>
                    <div class="audit-data-row"><span>Remuneración:</span> <strong class="text-success"
                                                                                   id="detail-remuneration">-</strong>
                    </div>
                    <div class="audit-data-row"><span>Fecha Inicio:</span> <strong id="detail-start-date">-</strong>
                    </div>
                    <div class="audit-data-row"><span>Fecha Fin:</span> <strong id="detail-end-date">-</strong></div>
                    <div class="audit-data-row"><span>Horario:</span> <strong id="detail-schedule">-</strong></div>
                </div>
            </div>

            <div class="modal-footer-fixed">
                <button type="button" id="btn-close-detail-bottom" class="btn-cancel">CERRAR EXPEDIENTE</button>
            </div>
        </div>
    </div>
</div>
