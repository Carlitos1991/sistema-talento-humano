{% load static %}
<div id="regimeFormModalOverlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-container-small animate-scale-in">
        <form id="regimeForm">
            {% csrf_token %}
            <input type="hidden" id="regime_id" name="id" value="">

            <!-- HEADER ESTANDARIZADO -->
            <div class="modal-header-medium">
                <div class="header-content-group">
                    <div class="header-icon-circle"><i class="fas fa-briefcase"></i></div>
                    <h3 class="header-title" id="regime-modal-title">Nuevo Régimen Laboral</h3>
                </div>
                <button type="button" class="btn-close-circle" id="btn-close-regime-modal-top" title="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- CUERPO DEL FORMULARIO -->
            <div class="modal-body-content modal-body-custom">
                <div class="form-section-card mb-0">
                    <div class="form-group mb-3">
                        <label class="form-label" for="regime_code">Código *</label>
                        <input type="text" id="regime_code" name="code"
                               class="form-control uppercase-input"
                               required
                               placeholder="EJ: LOSEP">
                        <small id="regime-code-hint" class="form-hint hidden">El código no puede modificarse una vez
                            creado.</small>
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label" for="regime_name">Nombre *</label>
                        <input type="text" id="regime_name" name="name"
                               class="form-control"
                               required
                               placeholder="Nombre del régimen">
                    </div>

                    <div class="form-group mb-0">
                        <label class="form-label" for="regime_description">Descripción</label>
                        <textarea id="regime_description" name="description"
                                  class="input-field"
                                  rows="3"
                                  placeholder="Detalle o normativa asociada..."></textarea>
                    </div>
                </div>
            </div>

            <!-- FOOTER ESTANDARIZADO -->
            <div class="modal-footer-medium modal-footer-spaced">
                <button type="button" id="btn-cancel-regime-form" class="btn-dark-blue-rectangle-outline">CANCELAR
                </button>
                <button type="submit" id="btn-submit-regime-form" class="btn-blue-rectangle">
                    <i class="fas fa-save me-1"></i> <span id="regime-submit-text">GUARDAR</span>
                </button>
            </div>
        </form>
    </div>
</div>
