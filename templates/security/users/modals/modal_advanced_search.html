<div class="modal-overlay">
    <div class="modal-container-medium">
        <form id="advancedSearchForm" onsubmit="return false;" class="modal-form-layout">
            <!-- HEADER -->
            <div class="modal-header-medium">
                <div class="header-content-group">
                    <div class="header-icon-circle">
                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                    </div>
                    <h3 class="header-title">Filtros Avanzados de Usuarios</h3>
                </div>
                <button type="button" class="btn-close-circle" onclick="closeModal()" title="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- BODY -->
            <div class="modal-body modal-body-custom schedule-modal-body">
                <div class="form-section-card">
                    <div class="grid-2-cols">
                        <div class="form-group">
                            <label class="form-label" for="{{ filter_form.cedula.id_for_label }}">Cédula /
                                Identificación</label>
                            {{ filter_form.cedula }}
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="{{ filter_form.status.id_for_label }}">Estado del
                                Usuario</label>
                            {{ filter_form.status }}
                        </div>
                    </div>

                    <div class="grid-2-cols mt-3">
                        <div class="form-group">
                            <label class="form-label" for="{{ filter_form.first_name.id_for_label }}">Nombres</label>
                            {{ filter_form.first_name }}
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="{{ filter_form.last_name.id_for_label }}">Apellidos</label>
                            {{ filter_form.last_name }}
                        </div>
                    </div>

                    <div class="form-group mt-3 mb-0">
                        <label class="form-label" for="{{ filter_form.role.id_for_label }}">Rol de Usuario</label>
                        {{ filter_form.role }}
                        <span class="form-hint">Filtra a los usuarios pertenecientes al rol seleccionado.</span>
                    </div>
                </div>
            </div>

            <!-- FOOTER -->
            <div class="modal-footer-fixed">
                <button type="button" class="btn-dark-blue-rectangle-outline" id="btn-clear-advanced-search">
                    <i class="fa-solid fa-eraser me-1"></i> LIMPIAR FILTROS
                </button>
                <button type="button" class="btn-dark-blue-rectangle" id="btn-apply-advanced-search">
                    <i class="fa-solid fa-search me-1"></i> APLICAR
                </button>
            </div>
        </form>
    </div>
</div>
