{% load static %}
<div id="helpMessageReplyModal" class="modal-overlay hidden">
    <div class="modal-container-medium shadow-card">
        <button type="button" class="btn-close-modal js-close-modal" title="Cerrar">
            <i class="fas fa-times"></i>
        </button>

        <div class="modal-header-refined">
            <div class="header-content-group">
                <div class="header-icon-circle" style="background:#7c3aed;">
                    <i class="fa-solid fa-reply"></i>
                </div>
                <h2 class="header-title-main">Responder Mensaje</h2>
            </div>
        </div>

        <form method="post" enctype="multipart/form-data" id="replyHelpMessageForm" action="{{ reply_target_url|default:'#' }}">
            {% csrf_token %}
            <input type="hidden" name="original_message_id" id="replyOriginalMessageId" value="{{ reply_original_id|default:'' }}">
            <div class="modal-body-scrolled">
                <div class="section-card-standard">
                    <p><strong>Responder a:</strong> <span id="replyMessageSender"></span></p>
                    <p><strong>Asunto original:</strong> <span id="replyOriginalSubject"></span></p>
                    <p><strong>Asunto de respuesta:</strong> <span id="replyGeneratedSubject"></span></p>
                </div>
                <div class="section-card-standard">
                    <div class="form-group">
                        <label class="form-label">Respuesta</label>
                        {{ reply_form.detail }}
                        {{ reply_form.detail.errors }}
                    </div>
                    <div class="form-group">
                        <label class="form-label">Anexo</label>
                        {{ reply_form.attachment }}
                        {{ reply_form.attachment.errors }}
                    </div>
                </div>
            </div>
            <div class="modal-footer-fixed">
                <button type="button" class="btn-cancel js-close-modal">
                    <i class="fas fa-times-circle"></i> Cancelar
                </button>
                <button type="submit" class="btn-save" style="background:#7c3aed; border-color:#7c3aed;">
                    <i class="fas fa-paper-plane"></i> Enviar Respuesta
                </button>
            </div>
        </form>
    </div>
</div>
