{% load static %}
<div id="helpMessageCloseModal" class="modal-overlay hidden">
    <div class="modal-container-medium shadow-card">
        <button type="button" class="btn-close-modal js-close-modal" title="Cerrar">
            <i class="fas fa-times"></i>
        </button>

        <div class="modal-header-refined">
            <div class="header-content-group">
                <div class="header-icon-circle" style="background:#0f766e;">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <h2 class="header-title-main">Finalizar Trámite</h2>
            </div>
        </div>

        <form method="post" enctype="multipart/form-data" id="closeHelpMessageForm" action="#">
            {% csrf_token %}
            <input type="hidden" name="original_message_id" id="closeOriginalMessageId" value="">
            <div class="modal-body-scrolled">
                <div class="section-card-standard">
                    <p><strong>Conversación:</strong> <span id="closeOriginalSubject"></span></p>
                    <p>Se enviará un último mensaje al usuario que inició el trámite y se cerrará la conversación.</p>
                </div>
                <div class="section-card-standard">
                    <div class="form-group">
                        <label class="form-label">Mensaje final</label>
                        {{ close_form.detail }}
                        {{ close_form.detail.errors }}
                    </div>
                    <div class="form-group">
                        <label class="form-label">Anexo</label>
                        {{ close_form.attachment }}
                        {{ close_form.attachment.errors }}
                    </div>
                </div>
            </div>
            <div class="modal-footer-fixed">
                <button type="button" class="btn-cancel js-close-modal">
                    <i class="fas fa-times-circle"></i> Cancelar
                </button>
                <button type="submit" class="btn-save" style="background:#0f766e; border-color:#0f766e;">
                    <i class="fa-solid fa-paper-plane"></i> Enviar y Finalizar
                </button>
            </div>
        </form>
    </div>
</div>
