<div id="action-type-modal-app" v-cloak>

    <div class="modal-overlay" :class="{ 'hidden': !isVisible }" @click.self="closeModal">
        <div class="modal-container shadow-card animate-scale-in" style="max-width: 550px;">

            <div class="modal-header-refined">
                <button type="button" @click="closeModal" class="btn-close-modal-refined">
                    <i class="fas fa-times"></i>
                </button>
                <div class="header-content-group">
                    <div class="header-icon-circle">
                        <i class="fas fa-file-pen"></i>
                    </div>
                    <h2 class="header-title-main">[[ isEdit ? 'Editar Tipo de Acción' : 'Nuevo Tipo de Acción' ]]</h2>
                </div>
            </div>

            <form @submit.prevent="saveData">
                <div class="modal-body-scrolled" style="max-height: 70vh; overflow-y: auto; padding: 20px;">

                    <div class="form-group mb-3">
                        <label class="form-label font-weight-bold">Código</label>
                        <input type="text" v-model="formData.code" class="form-control uppercase-input"
                               :disabled="isEdit" placeholder="Ej: NOM-PROV" required>
                        <small v-if="errors.code" class="text-danger">[[ errors.code[0] ]]</small>
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label font-weight-bold">Nombre de la Acción</label>
                        <input type="text" v-model="formData.name" class="form-control"
                               placeholder="Ej: Nombramiento Provisional" required>
                        <small v-if="errors.name" class="text-danger">[[ errors.name[0] ]]</small>
                    </div>

                    <div class="firmas-preconfiguradas-section mt-4 pt-3 border-top">
                        <h5 class="mb-3 text-secondary" style="font-size: 0.95rem; font-weight: 600;">
                            <i class="fas fa-signature me-2"></i>Firmas Preconfiguradas (Por Defecto)
                        </h5>

                        <div class="form-group mb-3">
                            <label class="form-label font-weight-bold">Autoridad Nominadora (1)</label>
                            <select class="form-control action-type-user-select" id="id_default_authority_1"></select>
                            <small v-if="errors.default_authority_1" class="text-danger">[[
                                errors.default_authority_1[0] ]]</small>
                        </div>

                        <div class="form-group mb-3">
                            <label class="form-label font-weight-bold">Director de Talento Humano (2)</label>
                            <select class="form-control action-type-user-select" id="id_default_authority_2"></select>
                            <small v-if="errors.default_authority_2" class="text-danger">[[
                                errors.default_authority_2[0] ]]</small>
                        </div>

                        <div class="form-group mb-3">
                            <label class="form-label font-weight-bold">Revisado Por</label>
                            <select class="form-control action-type-user-select" id="id_default_reviewer"></select>
                            <small v-if="errors.default_reviewer" class="text-danger">[[ errors.default_reviewer[0]
                                ]]</small>
                        </div>

                        <div class="form-group mb-3">
                            <label class="form-label font-weight-bold">Registrado Por</label>
                            <select class="form-control action-type-user-select" id="id_default_register"></select>
                            <small v-if="errors.default_register" class="text-danger">[[ errors.default_register[0]
                                ]]</small>
                        </div>
                    </div>

                    <div class="form-group mt-3 pt-2">
                        <label class="form-label mb-2 font-weight-bold">Estado del Registro</label>
                        <div class="d-flex align-items-center gap-3">
                            <label class="toggle-switch">
                                <input type="checkbox" id="chkActive" v-model="formData.is_active">
                                <span class="toggle-slider"></span>
                            </label>
                            <label for="chkActive" class="form-check-label"
                                   style="cursor: pointer; font-weight: 600; color: #475569;">
                                Registro Activo
                            </label>
                        </div>
                    </div>

                </div>

                <div class="modal-footer-fixed">
                    <button type="button" class="btn-cancel" @click="closeModal">CANCELAR</button>
                    <button type="submit" class="btn-save" :disabled="loading">
                        <i v-if="loading" class="fas fa-spinner fa-spin me-1"></i>
                        [[ isEdit ? 'ACTUALIZAR' : 'GUARDAR' ]]
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
