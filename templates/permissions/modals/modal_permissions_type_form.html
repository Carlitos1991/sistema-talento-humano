<form id="modalForm" method="post" action="
        {% if form.instance.pk %}{% url 'permissions:type_update' form.instance.pk %}{% else %}{% url 'permissions:type_create' %}{% endif %}">
    {% csrf_token %}

    <div class="modal-body">
        <!-- Error global oculto -->
        <div id="global-errors"
             style="display:none; color: #842029; background: #f8d7da; padding: 10px; border-radius: 4px; margin-bottom: 15px;"></div>

        <div class="form-group">
            <label class="form-label">Nombre del Permiso *</label>
            {{ form.name }}
        </div>

        <div class="form-group">
            <label class="form-label">Depende de (Opcional)</label>
            {{ form.parent }}
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <!-- Grid 2 columnas para checks -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="check-row">
                {{ form.needs_justification }}
                <label>Requiere Justificación</label>
            </div>
            <div class="check-row">
                {{ form.affects_vacation }}
                <label>Descuenta Vacaciones</label>
            </div>
            <div class="check-row">
                {{ form.requires_attachment }}
                <label>Obligatorio Adjunto PDF</label>
            </div>
            <div class="check-row">
                {{ form.is_active }}
                <label>Activo</label>
            </div>
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary js-close-modal">Cancelar</button>
        <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-save"></i> Guardar
        </button>
    </div>
</form>
