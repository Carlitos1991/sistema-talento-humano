<div id="location-create-app" v-cloak>
    <div class="modal-overlay" :class="{ 'hidden': !isVisible }" id="location-modal-overlay">
        <div class="modal-container">

            <!-- HEADER  -->
            <div class="modal-header modal-header-gradient">
                <h3 class="modal-title text-white">
                    <i class="fa-solid fa-map-pin me-2"></i> [[ modalTitle ]]
                </h3>
                <button type="button" class="btn-close-modal text-white-opacity" @click="closeModal">
                    &times;
                </button>
            </div>

            <form @submit.prevent="submitLocation">

                <!-- BODY con padding y estilo limpio -->
                <div class="modal-body">
                    {% csrf_token %}

                    <!-- Nombre de la Ubicación -->
                    <div class="form-group">
                        <label class="form-label required">Nombre de la Ubicación</label>
                        <input 
                            type="text" 
                            v-model="form.name" 
                            required 
                            class="form-control"
                            :class="{ 'is-invalid': errors.name }"
                            :placeholder="'Ej: ' + (form.level === 1 ? 'Ecuador' : form.level === 2 ? 'Pichincha' : form.level === 3 ? 'Quito' : 'La Mariscal')">
                        <div v-if="errors.name" class="invalid-feedback">
                            [[ errors.name[0] ]]
                        </div>
                    </div>

                    <!-- Info Visual del Nivel y Padre (Solo Lectura) -->
                    <div class="grid-2-cols mt-3">
                        <div class="form-group">
                            <label class="form-label">Nivel Jerárquico</label>
                            <input 
                                type="text" 
                                :value="levelLabel" 
                                readonly 
                                class="form-control bg-light">
                        </div>
                        <div class="form-group" v-if="form.parent">
                            <label class="form-label">Pertenece a</label>
                            <input 
                                type="text" 
                                :value="parentNameDisplay" 
                                readonly 
                                class="form-control bg-light">
                        </div>
                    </div>

                    <!-- Campos Ocultos para Backend -->
                    <input type="hidden" v-model="form.level">
                    <input type="hidden" v-model="form.parent">
                </div>

                <!-- FOOTER -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-cancel" @click="closeModal">Cancelar</button>
                    <button type="submit" class="btn btn-save">
                        <i class="fas fa-save me-1"></i>
                        [[ isEditing ? 'Actualizar' : 'Crear' ]] Ubicación
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
