<div class="modal-overlay">
    <div class="modal-container-medium">
        <form id="catalogForm" action="{{ action_url }}" method="post" autocomplete="off" class="modal-form-layout">
            {% csrf_token %}

            <!-- HEADER -->
            <div class="modal-header-medium">
                <div class="header-content-group">
                    <div class="header-icon-circle">
                        <i class="fa-solid fa-folder-tree"></i>
                    </div>
                    <h3 class="header-title">
                        {% if is_edit %}Editar Catálogo: {{ catalog.name }}{% else %}Nuevo Catálogo{% endif %}
                    </h3>
                </div>
                <button type="button" class="btn-close-circle" onclick="closeModal()" title="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- BODY -->
            <div class="modal-body modal-body-custom schedule-modal-body">
                <div class="form-section-card">
                    <div class="section-title">
                        <i class="fa-solid fa-info-circle text-green"></i> Información del Catálogo
                    </div>

                    <div class="grid-2-cols">
                        <div class="form-group">
                            <label class="form-label" for="id_catalog_code">Código Único *</label>
                            <input type="text"
                                   name="code"
                                   id="id_catalog_code"
                                   class="form-control {% if is_edit %}bg-readonly{% endif %}"
                                   placeholder="EJ: TIPO_DOCUMENTO"
                                   value="{{ catalog.code|default:'' }}"
                                   {% if is_edit %}readonly{% endif %}
                                   required>
                            <span class="form-hint">{% if is_edit %}El código no puede modificarse tras su
                                creación.{% else %}Identificador corto en mayúsculas.{% endif %}</span>
                            <div class="invalid-feedback" id="error-code"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="id_catalog_name">Nombre del Catálogo *</label>
                            <input type="text"
                                   name="name"
                                   id="id_catalog_name"
                                   class="form-control"
                                   placeholder="EJ: TIPOS DE DOCUMENTOS DE IDENTIDAD"
                                   value="{{ catalog.name|default:'' }}"
                                   required>
                            <span class="form-hint">Nombre descriptivo institucional.</span>
                            <div class="invalid-feedback" id="error-name"></div>
                        </div>
                    </div>
                </div>

                <div class="form-section-card mt-3">
                    <div class="form-group mb-0">
                        <label class="form-label">Estado del Catálogo</label>
                        <input type="checkbox"
                               name="is_active"
                               id="id_catalog_is_active"
                               class="switch-input switch-green"
                               value="true"
                               {% if not catalog or catalog.is_active %}checked{% endif %}>
                        <label class="switch-wrapper" for="id_catalog_is_active">
                            <span class="switch-circle"></span>
                            <span class="switch-text">Catálogo Activo</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- FOOTER CON BOTONES INSTITUCIONALES AZUL OSCURO -->
            <div class="modal-footer-fixed">
                <button type="button" class="btn-dark-blue-rectangle-outline" onclick="closeModal()">
                    <i class="fa-solid fa-xmark me-1"></i> CANCELAR
                </button>
                <button type="submit" class="btn-dark-blue-rectangle">
                    <i class="fas fa-save me-1"></i> {% if is_edit %}ACTUALIZAR{% else %}GUARDAR{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
