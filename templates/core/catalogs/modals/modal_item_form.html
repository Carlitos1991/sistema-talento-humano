<div class="modal-overlay">
    <div class="modal-container-medium">
        <form id="catalogItemForm" action="{{ action_url }}" method="post" autocomplete="off" class="modal-form-layout">
            {% csrf_token %}
            <input type="hidden" name="catalog" value="{{ catalog.id }}">

            <!-- HEADER -->
            <div class="modal-header-medium">
                <div class="header-content-group">
                    <div class="header-icon-circle">
                        <i class="fa-solid fa-tag"></i>
                    </div>
                    <h3 class="header-title">
                        {% if is_edit %}Editar Ítem: {{ item.name }}{% else %}Nuevo Ítem en:
                            {{ catalog.name }}{% endif %}
                    </h3>
                </div>
                <button type="button" class="btn-close-circle" onclick="closeModal()" title="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- BODY -->
            <div class="modal-body modal-body-custom schedule-modal-body">
                <div class="form-section-card">
                    <div class="section-title">
                        <i class="fa-solid fa-barcode text-green"></i> Datos del Ítem
                    </div>

                    <div class="grid-2-cols">
                        <div class="form-group">
                            <label class="form-label" for="id_item_code">Código del Ítem *</label>
                            <input type="text"
                                   name="code"
                                   id="id_item_code"
                                   class="form-control {% if is_edit %}bg-readonly{% endif %}"
                                   placeholder="EJ: CED"
                                   value="{{ item.code|default:'' }}"
                                   {% if is_edit %}readonly{% endif %}
                                   required>
                            <span class="form-hint">Clave única dentro de este catálogo.</span>
                            <div class="invalid-feedback" id="error-code"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="id_item_name">Nombre / Etiqueta *</label>
                            <input type="text"
                                   name="name"
                                   id="id_item_name"
                                   class="form-control"
                                   placeholder="EJ: CÉDULA DE CIUDADANÍA"
                                   value="{{ item.name|default:'' }}"
                                   required>
                            <span class="form-hint">Texto visible en las listas desplegables.</span>
                            <div class="invalid-feedback" id="error-name"></div>
                        </div>
                    </div>

                    <div class="form-group mt-3 mb-0">
                        <label class="form-label" for="id_item_description">Descripción / Detalle</label>
                        <textarea name="description"
                                  id="id_item_description"
                                  class="form-control"
                                  rows="2"
                                  placeholder="Opcional: información adicional o fundamento legal...">{{ item.description|default:'' }}</textarea>
                    </div>
                </div>

                <div class="form-section-card mt-3">
                    <div class="form-group mb-0">
                        <label class="form-label">Estado del Ítem</label>
                        <input type="checkbox"
                               name="is_active"
                               id="id_item_is_active"
                               class="switch-input switch-green"
                               value="true"
                               {% if not item or item.is_active %}checked{% endif %}>
                        <label class="switch-wrapper" for="id_item_is_active">
                            <span class="switch-circle"></span>
                            <span class="switch-text">Ítem Activo</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- FOOTER -->
            <div class="modal-footer-fixed">
                <button type="button" class="btn-secondary-outline" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-success">
                    <i class="fas fa-save me-1"></i> {% if is_edit %}ACTUALIZAR ÍTEM{% else %}GUARDAR ÍTEM{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
