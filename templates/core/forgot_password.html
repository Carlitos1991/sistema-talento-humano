{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contrasena | SIGETH</title>
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .swal2-popup.swal2-loading-modern {
            border-radius: 14px;
            padding: 1.5rem;
        }

        .loading-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }

        .loading-ring {
            width: 52px;
            height: 52px;
            border: 5px solid #dbeafe;
            border-top-color: #0f4c81;
            border-radius: 50%;
            animation: spin-ring 0.85s linear infinite;
        }

        .loading-text {
            font-size: 0.95rem;
            color: #334155;
            margin: 0;
        }

        @keyframes spin-ring {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <img src="{% static 'img/logo.png' %}" alt="Logo" class="login-logo">
            <h2>Recuperar credenciales</h2>
        </div>

        <p style="font-size:0.9rem;color:#64748b;margin-bottom:18px;">
            Ingrese su cédula y valide su fecha de nacimiento. El sistema enviará usuario y contraseña al correo institucional registrado.
        </p>

        <form id="forgotPasswordForm" method="post">
            {% csrf_token %}
            <div class="form-group">
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-id-card input-icon-left"></i>
                    <input type="text" id="cedula" name="cedula" class="form-control with-icon" placeholder="Cédula" required>
                </div>
            </div>

            <div class="form-group">
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-calendar-days input-icon-left"></i>
                    <input type="date" id="birth_date" name="birth_date" class="form-control with-icon" required>
                </div>
            </div>

            <button type="submit" class="btn-primary">Recuperar y enviar credenciales</button>
            <a href="{% url 'core:login' %}" class="forgot-password-link" style="display:block;text-align:right;margin-top:12px;">Volver a Inicio de Sesión</a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
const swalEs = Swal.mixin({
    confirmButtonText: 'Aceptar',
    cancelButtonText: 'Cancelar'
});

function showLoadingModal(message) {
    swalEs.fire({
        title: 'Procesando solicitud',
        html: `<div class="loading-wrap"><div class="loading-ring"></div><p class="loading-text">${message}</p></div>`,
        showConfirmButton: false,
        allowOutsideClick: false,
        allowEscapeKey: false,
        customClass: {
            popup: 'swal2-loading-modern'
        }
    });
}

document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const cedula = document.getElementById('cedula').value.trim();
    const birth_date = document.getElementById('birth_date').value.trim();
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    if (!cedula || !birth_date) {
        swalEs.fire('Atención', 'Debe ingresar la cédula y la fecha de nacimiento.', 'warning');
        return;
    }

    showLoadingModal('Por favor, espere mientras procesamos su solicitud.');

    try {
        const formData = new FormData();
        formData.append('cedula', cedula);
        formData.append('birth_date', birth_date);
        formData.append('csrfmiddlewaretoken', csrfToken);

        const response = await fetch('{% url "core:forgot_password" %}', {
            method: 'POST',
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: formData
        });

        const data = await response.json();

        if (data.status === 'success') {
            swalEs.fire({
                title: '¡Éxito!',
                html: `<p>${data.message}</p><p style="font-size:0.9rem; color:#64748b; margin-top:10px;">Revise su bandeja de entrada y carpeta de spam.</p>`,
                icon: 'success',
                confirmButtonText: 'Ir al login',
                allowOutsideClick: false,
                willClose: () => {
                    window.location.href = '{% url "core:login" %}';
                }
            });
        } else {
            swalEs.fire('Error', data.message, 'error');
        }
    } catch (error) {
        console.error(error);
        swalEs.fire('Error', 'Hubo un problema de conexión. Intente nuevamente.', 'error');
    }
});
</script>
</body>
</html>
