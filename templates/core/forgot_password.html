{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar Contraseña | SIGETH</title>
    <link rel="icon" href="/favicon.ico?v=20260415" sizes="any">
    <link rel="shortcut icon" href="/favicon.ico?v=20260415">
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}?v=20260415">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Lexend:wght@400;600;700;800;900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <img src="{% static 'img/LOGO2027.png' %}" alt="SIGETH Logo" class="login-logo">
            <h2>Recuperar Contraseña</h2>
        </div>
        <p class="login-description">
            Ingrese su usuario o correo y su fecha de nacimiento para enviar un enlace de restablecimiento.
        </p>

        <form method="post"
              action="{% url 'core:forgot_password' %}"
              id="forgotPasswordForm"
              data-ajax-auth="true"
              data-loading-title="Validando información"
              data-loading-subtitle="Enviando enlaces de restablecimiento..."
              data-success-title="Solicitud procesada" data-redirect-url="{% url 'core:login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="identificador">Usuario o correo electrónico</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-user input-icon-left"></i>
                    <input id="identificador"
                           name="identificador"
                           type="text"
                           class="form-control with-icon"
                           placeholder="Usuario o correo registrado"
                           required>
                </div>
            </div>

            <div class="form-group">
                <label for="birth_date">Fecha de nacimiento</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-calendar-day input-icon-left"></i>
                    <input id="birth_date"
                           name="birth_date"
                           type="date"
                           class="form-control with-icon"
                           required>
                </div>
            </div>

            <button type="submit" id="forgotSubmitBtn" class="btn-success-login">
                <i class="fa-solid fa-paper-plane me-1"></i> Enviar Enlace
            </button>
        </form>

        <div class="login-back-link">
            <a href="{% url 'core:login' %}" class="btn-link">
                <i class="fa-solid fa-arrow-left"></i> Volver al inicio de sesión
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{% static 'js/login.js' %}?v=20261116"></script>
</body>
</html>
