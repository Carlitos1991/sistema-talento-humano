{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear Usuario | SIGETH</title>
    <link rel="icon" href="/favicon.ico?v=20260415" sizes="any">
    <link rel="shortcut icon" href="/favicon.ico?v=20260415">
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}?v=20260415">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Lexend:wght@400;600;700;800;900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <img src="{% static 'img/LOGO2027.png' %}" alt="SIGETH Logo" class="login-logo">
            <h2>Crear Usuario</h2>
        </div>
        <p class="login-description">
            Ingrese su número de cédula para verificar su registro y enviar las credenciales a su correo.
        </p>

        <form method="post"
              action="{% url 'core:create_user_from_login' %}"
              id="createUserLoginForm"
              data-ajax-auth="true"
              data-loading-title="Creando cuenta"
              data-loading-subtitle="Verificando registro y enviando credenciales..."
              data-success-title="Usuario creado">
            {% csrf_token %}
            <div class="form-group">
                <label for="cedula">Número de cédula</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-id-card input-icon-left"></i>
                    <input id="cedula"
                           name="cedula"
                           type="text"
                           class="form-control with-icon"
                           maxlength="20"
                           placeholder="Ej. 1104567890"
                           required>
                </div>
            </div>
            <button type="submit" id="createSubmitBtn" class="btn-success-login">
                <i class="fa-solid fa-user-plus me-1"></i> Crear Usuario
            </button>
        </form>

        <div class="login-back-link">
            <a href="{% url 'core:login' %}" class="btn-link">
                <i class="fa-solid fa-arrow-left"></i> Volver al inicio de sesión
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{% static 'js/login.js' %}?v=20261116"></script>
</body>
</html>
