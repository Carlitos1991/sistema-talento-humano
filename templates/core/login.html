{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SIGETH</title>

    <!-- 1. FAVICON -->
    <link rel="icon" href="/favicon.ico?v=20260415" sizes="any">
    <link rel="shortcut icon" href="/favicon.ico?v=20260415">
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}?v=20260415">

    <!-- 2. FUENTES e ICONOS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Lexend:wght@400;600;700;800;900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 3. ESTILOS PROPIOS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <img src="{% static 'img/LOGO2027.png' %}" alt="Logo" class="login-logo">
            <h2>Sistema de Gestión de Talento Humano</h2>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="login-alert {% if 'error' in message.tags %}login-alert-error{% else %}login-alert-success{% endif %}"
                     role="alert">
                    <i class="fa-solid {% if 'error' in message.tags %}fa-circle-exclamation{% else %}fa-circle-check{% endif %}"></i>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-group">
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-user input-icon-left"></i>
                    <input type="text"
                           name="username"
                           value="{{ username|default:'' }}"
                           class="form-control with-icon"
                           placeholder="Nombre de usuario"
                           required
                           {% if not username %}autofocus{% endif %}>
                </div>
            </div>

            <div class="form-group">
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-lock input-icon-left"></i>
                    <input type="password"
                           id="passwordInput"
                           name="password"
                           class="form-control with-icon"
                           placeholder="Contraseña"
                           required
                           {% if username %}autofocus{% endif %}>
                    <i class="fa fa-eye toggle-password" id="togglePasswordBtn"></i>
                </div>

                <div class="text-right mt-2">
                    <a href="{% url 'core:forgot_password' %}" class="btn-link">¿Olvidaste tu contraseña?</a>
                </div>
            </div>

            <button type="submit" class="btn-success-login">
                Ingresar al Sistema
            </button>

            <div class="login-back-link">
                <a href="{% url 'core:create_user_from_login' %}" class="btn-link">Crear usuario</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{% static 'js/login.js' %}?v=20261116"></script>
</body>
</html>
