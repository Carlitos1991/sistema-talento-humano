{% for a in accounts %}
    <tr>
        <td>{{ a.code }}</td>
        <td><strong>{{ a.name }}</strong></td>
        <td><strong>{{ a.order }}</strong></td>
        <td>{{ a.get_type_display }}</td>
        <td class="text-center">{% if a.is_active %}
            <span class="status-badge active"><i class="fas fa-check-circle"></i> Activo</span>{% else %}
            <span class="status-badge inactive"><i class="fas fa-times-circle"></i> Inactivo</span>{% endif %}</td>
        <td class="actions">
            <div class="actions-wrapper">
                <button class="btn-icon btn-views-action" title="Editar" type="button"
                        onclick="openAccountModal('{% url 'accounting:account_edit' a.pk %}')">
                    <i class="fas fa-pen"></i>
                </button>
            </div>
        </td>
    </tr>
{% empty %}
    <tr>
        <td colspan="5">No hay cuentas definidas.</td>
    </tr>
{% endfor %}
