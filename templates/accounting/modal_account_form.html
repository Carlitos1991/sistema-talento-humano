<div class="modal-overlay" id="accountModalOverlay">
    <div class="modal-container-medium">

        <div class="modal-header-refined">
            <div class="header-content-group">
                <div class="header-icon-circle"><i class="fas fa-book-open"></i></div>
                <h3 class="header-title-main">
                    {% if form.instance.pk %}Editar{% else %}Nueva{% endif %} Cuenta Contable
                </h3>
            </div>
            <button type="button" class="btn-close-circle" onclick="closeAjaxModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form method="post" id="accountForm" action="{{ request.path }}" onsubmit="submitAccountForm(event)">
            {% csrf_token %}
            <div class="modal-body-custom">
                <div class="form-section-card">
                    <div class="row g-3">
                        <div class="col-md-6 form-group">
                            <label class="form-label">Código</label>
                            {{ form.code }}
                        </div>
                        <div class="col-md-6 form-group">
                            <label class="form-label">Nombre</label>
                            {{ form.name }}
                        </div>
                        <div class="col-md-6 form-group">
                            <label for="{{ form.order.id_for_label }}" class="form-label text-uppercase text-muted"
                                   style="font-size: 0.75rem; font-weight: bold;">
                                Orden de Reporte (Prioridad)
                            </label>
                            {{ form.order }}
                        </div>
                        <div class="col-md-6 form-group">
                            <label class="form-label">Tipo</label>
                            {{ form.type }}
                        </div>

                        <div class="col-md-12 form-group mt-3">
                            {% if form.description %}{{ form.description }}{% endif %}
                        </div>

                        <div class="col-md-12 form-group mt-3">
                            <div class="d-flex align-items-center justify-content-center">
                                {{ form.is_active }}
                                <label class="switch-wrapper mb-0" for="{{ form.is_active.id_for_label }}">
                                    <div class="switch-circle"></div>
                                    <span class="switch-text">Activo en el Sistema</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer-fixed">
                <button type="button" class="btn-default-outline" onclick="closeAjaxModal()">Cancelar</button>
                <button type="submit" class="btn-default"><i class="fas fa-save"></i> Guardar</button>
            </div>
        </form>
    </div>
</div>
