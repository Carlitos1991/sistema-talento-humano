<div class="modal-overlay" id="accountModalOverlay">
    <div class="modal-container-medium">

        <div class="modal-header-refined">
            <div class="header-content-group">
                <div class="header-icon-circle"><i class="fas fa-book-open"></i></div>
                <h3 class="header-title-main">
                    {% if form.instance.pk %}Editar{% else %}Nueva{% endif %} Cuenta Contable
                </h3>
            </div>
            <button type="button" class="btn-close-modal-refined" onclick="closeContributionModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form method="post" id="accountForm" action="{{ request.path }}" onsubmit="submitAccountForm(event)">
            {% csrf_token %}
            <div class="modal-body-custom">
                <div class="form-section-card">
                    <div class="row g-3">
                        <div class="col-md-4 form-group">
                            <label class="form-label">Código</label>
                            {{ form.code }}
                        </div>
                        <div class="col-md-4 form-group">
                            <label class="form-label">Nombre</label>
                            {{ form.name }}
                        </div>
                        <div class="col-md-4 form-group">
                            {{ form.type }}
                        </div>

                        <div class="col-md-12 form-group mt-3">
                            {% if form.description %}{{ form.description }}{% endif %}
                        </div>

                        <div class="col-12 form-group mt-4">
                            <div class="d-flex justify-content-center align-items-center gap-3">
                                <label class="toggle-switch">
                                    {{ form.is_active }}
                                    <span class="toggle-slider"></span>
                                </label>
                                <span class="font-weight-600 text-primary-bold" style="font-size: 0.95rem;">Activo en el Sistema</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer-fixed">
                <button type="button" class="btn-cancel" onclick="closeContributionModal()">Cancelar</button>
                <button type="submit" class="btn-save"><i class="fas fa-save"></i> Guardar</button>
            </div>
        </form>
    </div>
</div>
