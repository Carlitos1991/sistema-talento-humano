{% extends 'base.html' %}
{% block content %}
<div class="container">
  <h2>Cuentas Contables</h2>
  <a class="btn btn-primary" href="{% url 'accounting:account_add' %}">Nueva Cuenta</a>
  <table class="table mt-3">
    <thead>
      <tr>
        <th>Código</th>
        <th>Nombre</th>
        <th>Tipo</th>
        <th>Activo</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for a in accounts %}
      <tr>
        <td>{{ a.code }}</td>
        <td>{{ a.name }}</td>
        <td>{{ a.get_type_display }}</td>
        <td>{{ a.is_active }}</td>
        <td>
          <a class="btn btn-sm btn-secondary" href="{% url 'accounting:account_edit' a.pk %}">Editar</a>
          <a class="btn btn-sm btn-danger" href="{% url 'accounting:account_delete' a.pk %}">Eliminar</a>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="5">No hay cuentas definidas.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
