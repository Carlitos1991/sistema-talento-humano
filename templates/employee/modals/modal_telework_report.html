<div class="modal-overlay" id="modalTeleworkReportOverlay">
    <div class="modal-container-medium">
        <!-- HEADER -->
        <div class="modal-header">
            <div class="header-content-group">
                <div class="header-icon-circle">
                    <i class="fa-solid fa-file-pdf"></i>
                </div>
                <div>
                    <h3 class="header-title">Generar Reporte de Teletrabajo</h3>
                    <p class="small text-muted mb-0">{{ person.full_name }}</p>
                </div>
            </div>
            <button type="button" onclick="closeModal()" class="btn-close-circle" aria-label="Cerrar">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- FORMULARIO: abre en nueva pestaña con target="_blank" -->
        <form action="{% url 'employee:generate_telework_report_pdf' person.id %}"
              method="GET"
              target="_blank"
              onsubmit="setTimeout(() => closeModal(), 300)">

            <div class="modal-body-custom">
                <div class="form-section-card">

                    <div class="mb-3">
                        <label class="form-label text-dark fw-bold">
                            <i class="fa-regular fa-calendar-days me-1 text-muted"></i> Seleccione el Período
                        </label>
                        <p class="small text-muted mb-0">
                            Indique el rango de fechas para recopilar las actividades registradas.
                        </p>
                    </div>

                    <div class="grid-2-cols grid-compact">
                        <div class="form-group">
                            <label class="form-label">Fecha Desde</label>
                            <input type="date"
                                   name="start"
                                   id="report_start_date"
                                   class="input-field"
                                   value="{{ first_day }}"
                                   required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Fecha Hasta</label>
                            <input type="date"
                                   name="end"
                                   id="report_end_date"
                                   class="input-field"
                                   value="{{ today }}"
                                   required>
                        </div>
                    </div>

                </div>
            </div>

            <!-- FOOTER FIJO -->
            <div class="modal-footer-fixed">
                <button type="button" onclick="closeModal()" class="btn-white-rectangle">
                    <i class="fa-solid fa-xmark"></i> Cancelar
                </button>
                <button type="submit" class="btn-success">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> Generar en Nueva Pestaña
                </button>
            </div>
        </form>
    </div>
</div>
