<div v-if="isReportModalVisible" class="modal-overlay" style="display:flex; z-index: 1050;" role="dialog" aria-modal="true">
    <div class="modal-container animate-scale-in" style="max-width:500px; width:calc(100% - 40px);">

        <!-- HEADER -->
        <div class="modal-header modal-header-gradient" style="background: linear-gradient(135deg, #6b21a8 0%, #9d174d 100%);">
            <h3 class="modal-title text-white">
                <i class="fa-solid fa-file-pdf me-2"></i> Generar Reporte PDF
            </h3>
            <button type="button" class="btn-close-modal text-white-opacity" @click="isReportModalVisible = false">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>

        <!-- FORM WRAPPER -->
        <form @submit.prevent="generateTeleworkReport" style="display: flex; flex-direction: column; height: 100%;">

            <!-- BODY -->
            <div class="modal-body modal-body-custom p-4">
                <p class="text-gray-600 text-sm mb-4">Seleccione el rango de fechas para el informe de actividades de teletrabajo.</p>
                <div class="grid-cantidad-asunto" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: flex-start;">
                    <div class="form-group mb-0">
                        <label class="form-label">
                            <i class="fa-solid fa-calendar-days"></i> Desde
                        </label>
                        <input type="date" v-model="reportDates.start" class="form-control input-field" required>
                    </div>
                    <div class="form-group mb-0">
                        <label class="form-label">
                            <i class="fa-solid fa-calendar-days"></i> Hasta
                        </label>
                        <input type="date" v-model="reportDates.end" class="form-control input-field" required>
                    </div>
                </div>
            </div>

            <!-- FOOTER -->
            <div class="modal-footer modal-footer-spaced mt-3 border-t">
                <button type="button" class="btn-cancel" @click="isReportModalVisible = false">
                    Cancelar
                </button>
                <button type="submit" class="btn-save" style="background: linear-gradient(to right, #9d174d, #6b21a8); border: none;">
                    <i class="fa-solid fa-file-arrow-down me-1"></i> Generar PDF
                </button>
            </div>
        </form>

    </div>
</div>
