<div class="modal-overlay" id="modalTeleworkActivityOverlay">
    <div class="modal-container-medium">
        <!-- HEADER -->
        <div class="modal-header">
            <div class="header-content-group">
                <div class="header-icon-circle">
                    <i class="fa-solid fa-list-check"></i>
                </div>
                <div>
                    <h3 class="header-title">Registrar Actividad de Teletrabajo</h3>
                    <p class="small text-muted mb-0">{{ person.full_name }}</p>
                </div>
            </div>
            <button type="button" onclick="closeModal()" class="btn-close-circle" aria-label="Cerrar">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- FORMULARIO -->
        <form action="{% url 'employee:add_telework_activity_api' person.id %}"
              method="POST"
              onsubmit="submitAjaxForm(event, () => {
                  closeModal();
                  if (typeof loadTeleworkData === 'function') {
                      loadTeleworkData();
                  } else {
                      window.location.reload();
                  }
              })">
            {% csrf_token %}

            <div class="modal-body-custom">
                <div class="form-section-card">

                    <!-- 1. TÍTULO -->
                    <div class="form-group mb-3">
                        <label class="form-label">
                            <i class="fa-solid fa-heading me-1 text-muted"></i> Título de la Actividad
                        </label>
                        <input type="text"
                               name="title"
                               id="id_activity_title"
                               class="input-field uppercase-input"
                               placeholder="Ej. Revisión y validación de expedientes"
                               required>
                    </div>

                    <!-- 2. DETALLES -->
                    <div class="form-group mb-3">
                        <label class="form-label">
                            <i class="fa-solid fa-note-sticky me-1 text-muted"></i> Detalles Adicionales
                        </label>
                        <textarea name="detail"
                                  id="id_activity_detail"
                                  class="input-field"
                                  rows="3"
                                  placeholder="Describa el trabajo ejecutado durante esta jornada..."></textarea>
                    </div>

                    <!-- 3. CONTROL DESLIZANTE DE AVANCE -->
                    <div class="form-group mb-0">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="form-label mb-0">
                                <i class="fa-solid fa-bars-progress me-1 text-muted"></i> Avance de la Tarea
                            </label>
                            <span id="teleworkPercentageBadge" class="badge-percentage">50%</span>
                        </div>
                        <div class="range-slider-wrapper">
                            <span class="range-label">0%</span>
                            <input type="range"
                                   name="percentage"
                                   id="id_activity_percentage"
                                   class="range-slider-input"
                                   min="0"
                                   max="100"
                                   step="5"
                                   value="50"
                                   oninput="document.getElementById('teleworkPercentageBadge').textContent = this.value + '%'">
                            <span class="range-label">100%</span>
                        </div>
                    </div>

                </div>
            </div>

            <!-- FOOTER FIJO -->
            <div class="modal-footer-fixed">
                <button type="button" onclick="closeModal()" class="btn-white-rectangle">
                    <i class="fa-solid fa-xmark"></i> Cancelar
                </button>
                <button type="submit" class="btn-success">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar Actividad
                </button>
            </div>
        </form>
    </div>
</div>
