<div class="modal-overlay" id="modalPersonEditOverlay">
    <div class="modal-container-large">
        <!-- HEADER -->
        <div class="modal-header">
            <div class="header-content-group">
                <div class="header-icon-circle">
                    <i class="fa-solid fa-user-gear"></i>
                </div>
                <div>
                    <h3 class="header-title">Ficha de Información Personal</h3>
                    <p class="small mb-0" style="color: #cbd5e1;">{{ object.full_name }}</p>
                </div>
            </div>
            <button type="button" onclick="closeModal()" class="btn-close-circle" aria-label="Cerrar">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- FORMULARIO AJAX -->
        <form id="personEditForm"
              action="{% url 'person:person_update' object.pk %}"
              method="POST"
              enctype="multipart/form-data"
              onsubmit="submitAjaxForm(event)">
            {% csrf_token %}

            <div class="modal-body-custom">

                <!-- 1. IDENTIDAD BÁSICA -->
                <div class="form-section-card mb-3">
                    <h6 class="section-title"><i class="fa-solid fa-id-card"></i> Identidad y Foto</h6>
                    <div class="d-flex align-items-center gap-4">
                        <div class="photo-uploader-wrapper-lg">
                            <label class="photo-upload-label">
                                <div class="photo-preview-box-lg shadow-sm">
                                    <img id="photo-preview-img"
                                         src="{% if object.photo %}{{ object.photo.url }}{% else %}#{% endif %}"
                                         style="width: 100%; height: 100%; object-fit: cover; {% if not object.photo %}display:none;{% endif %}">
                                    <div id="photo-placeholder" class="placeholder-icon"
                                         {% if object.photo %}style="display:none;"{% endif %}>
                                        <i class="fa-solid fa-camera fa-2x"></i>
                                    </div>
                                </div>
                                <input type="file" name="photo" class="hidden" accept="image/*"
                                       onchange="handleModalPhotoPreview(this)">
                            </label>
                        </div>
                        <div class="flex-grow-1">
                            <div class="grid-2-cols grid-compact">
                                <div class="form-group form-group-compact">
                                    <label class="form-label">Tipo Documento</label>
                                    <input type="text" value="{{ object.document_type.name }}"
                                           class="input-field readonly-styled" readonly>
                                    <input type="hidden" name="document_type" value="{{ object.document_type_id }}">
                                </div>
                                <div class="form-group form-group-compact">
                                    <label class="form-label">Número Documento</label>
                                    <input type="text" name="document_number"
                                           value="{{ form.document_number.value|default:'' }}"
                                           class="input-field readonly-styled" readonly>
                                </div>
                                <div class="form-group form-group-compact">
                                    <label class="form-label">Nombres</label>
                                    <input type="text" name="first_name" value="{{ form.first_name.value|default:'' }}"
                                           class="input-field uppercase-input">
                                </div>
                                <div class="form-group form-group-compact">
                                    <label class="form-label">Apellidos</label>
                                    <input type="text" name="last_name" value="{{ form.last_name.value|default:'' }}"
                                           class="input-field uppercase-input">
                                </div>
                                <div class="form-group form-group-compact">
                                    <label class="form-label">Género</label>
                                    <select name="gender" class="input-field select2-field">
                                        <option value="">-- Seleccione --</option>
                                        {% for g in gender_list %}
                                            <option value="{{ g.id }}"
                                                    {% if form.gender.value == g.id %}selected{% endif %}>{{ g.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="form-group form-group-compact">
                                    <label class="form-label">Fecha de Nacimiento</label>
                                    <input type="date"
                                           name="birth_date"
                                           value="{{ object.birth_date|date:'Y-m-d' }}"
                                           class="input-field">
                                </div>
                                <div class="form-group form-group-compact">
                                    <label class="form-label">Estado Civil</label>
                                    <select name="marital_status" class="input-field select2-field">
                                        <option value="">-- Seleccione --</option>
                                        {% for ms in marital_status_list %}
                                            <option value="{{ ms.id }}"
                                                    {% if form.marital_status.value == ms.id %}selected{% endif %}>{{ ms.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="form-group form-group-compact">
                                    <label class="form-label">Tipo Sangre</label>
                                    <select name="blood_type" class="input-field select2-field">
                                        <option value="">-- Seleccione --</option>
                                        {% for bt in blood_type_list %}
                                            <option value="{{ bt.id }}"
                                                    {% if form.blood_type.value == bt.id %}selected{% endif %}>{{ bt.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. CONTACTO Y UBICACIÓN -->
                <div class="form-section-card mb-3">
                    <h6 class="section-title"><i class="fa-solid fa-location-dot"></i> Contacto y Residencia</h6>
                    <div class="grid-3-cols grid-compact">
                        <div class="form-group form-group-compact">
                            <label class="form-label">Email Personal</label>
                            <input type="email" name="email" value="{{ form.email.value|default:'' }}"
                                   class="input-field">
                        </div>
                        <div class="form-group form-group-compact">
                            <label class="form-label">Celular</label>
                            <input type="text" name="phone_number" value="{{ form.phone_number.value|default:'' }}"
                                   class="input-field">
                        </div>
                        <div class="form-group form-group-compact">
                            <label class="form-label">País</label>
                            <select name="country" id="id_country_modal" class="input-field select2-field"
                                    onchange="handleLocationCascade(this, 'id_province_modal', 'province')">
                                <option value="">-- Seleccione --</option>
                                {% for c in country_list %}
                                    <option value="{{ c.id }}"
                                            {% if form.country.value == c.id %}selected{% endif %}>{{ c.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="grid-3-cols grid-compact mt-2">
                        <div class="form-group form-group-compact">
                            <label class="form-label">Provincia</label>
                            <select name="province" id="id_province_modal" class="input-field select2-field"
                                    onchange="handleLocationCascade(this, 'id_canton_modal', 'canton')">
                                <option value="">-- Seleccione --</option>
                                {% for p in form.fields.province.queryset %}
                                    <option value="{{ p.id }}"
                                            {% if form.province.value == p.id %}selected{% endif %}>{{ p.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group form-group-compact">
                            <label class="form-label">Cantón</label>
                            <select name="canton" id="id_canton_modal" class="input-field select2-field"
                                    onchange="handleLocationCascade(this, 'id_parish_modal', 'parish')">
                                <option value="">-- Seleccione --</option>
                                {% for can in form.fields.canton.queryset %}
                                    <option value="{{ can.id }}"
                                            {% if form.canton.value == can.id %}selected{% endif %}>{{ can.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group form-group-compact">
                            <label class="form-label">Parroquia</label>
                            <select name="parish" id="id_parish_modal" class="input-field select2-field">
                                <option value="">-- Seleccione --</option>
                                {% for par in form.fields.parish.queryset %}
                                    <option value="{{ par.id }}"
                                            {% if form.parish.value == par.id %}selected{% endif %}>{{ par.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="form-group mt-2">
                        <label class="form-label small">Dirección Exacta</label>
                        <textarea name="address_reference" class="input-field uppercase-input"
                                  rows="1">{{ form.address_reference.value|default:'' }}</textarea>
                    </div>
                </div>

                <!-- 3. CONTACTO DE EMERGENCIA -->
                <div class="form-section-card mb-3">
                    <h6 class="section-title"><i class="fa-solid fa-truck-medical"></i> Contacto de Emergencia</h6>
                    <div class="grid-3-cols grid-compact">
                        <div class="form-group form-group-compact">
                            <label class="form-label">Nombre</label>
                            <input type="text" name="emergency_contact_name"
                                   value="{{ form.emergency_contact_name.value|default:'' }}"
                                   class="input-field uppercase-input">
                        </div>
                        <div class="form-group form-group-compact">
                            <label class="form-label">Teléfono</label>
                            <input type="text" name="emergency_contact_phone"
                                   value="{{ form.emergency_contact_phone.value|default:'' }}" class="input-field">
                        </div>
                        <div class="form-group form-group-compact">
                            <label class="form-label">Parentesco</label>
                            <select name="emergency_contact_relationship" class="input-field select2-field">
                                <option value="">-- Seleccione --</option>
                                {% for r in relationships %}
                                    <option value="{{ r.id }}"
                                            {% if form.emergency_contact_relationship.value == r.id %}selected{% endif %}>{{ r.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 4. SALUD E INCLUSIÓN (Toggles de Accordion Vanilla) -->
                <div class="form-section-card">
                    <h6 class="section-title"><i class="fa-solid fa-hands-holding-circle"></i> Salud e Inclusión</h6>
                    <div style="display: flex; flex-direction: column; gap: 1rem;">

                        <!-- Discapacidad -->
                        <div class="w-100">
                            <div class="toggle-header {% if form.has_disability.value %}active-header{% endif %}"
                                 onclick="toggleAccordionSection('toggle-disability')">
                                <span class="d-flex align-items-center gap-2 font-weight-700 text-secondary">
                                    <i class="fa-brands fa-accessible-icon text-primary"></i> ¿Tiene Discapacidad?
                                </span>
                                <label class="switch-wrapper" onclick="event.stopPropagation()">
                                    <input type="checkbox" name="has_disability" id="id_has_disability"
                                           class="switch-input switch-green"
                                           {% if form.has_disability.value %}checked{% endif %}
                                           onchange="syncToggleView(this, 'toggle-disability')">
                                    <span class="switch-circle"></span>
                                    <span class="switch-text">{% if form.has_disability.value %}Sí{% else %}
                                        No{% endif %}</span>
                                </label>
                            </div>
                            <div id="toggle-disability"
                                 class="toggle-content {% if not form.has_disability.value %}hidden{% endif %}">
                                <div class="grid-2-cols grid-compact">
                                    <div class="form-group">
                                        <label class="form-label small">Tipo</label>
                                        <select name="disability_type" class="input-field select2-field">
                                            <option value="">-- Seleccione --</option>
                                            {% for dt in disability_types %}
                                                <option value="{{ dt.id }}"
                                                        {% if form.disability_type.value == dt.id %}selected{% endif %}>{{ dt.name }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label small">Porcentaje (%)</label>
                                        <input type="number" name="disability_percentage"
                                               value="{{ form.disability_percentage.value|default:'' }}"
                                               class="input-field">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Enfermedad Catastrófica -->
                        <div class="w-100">
                            <div class="toggle-header {% if form.has_catastrophic_illness.value %}active-header{% endif %}"
                                 onclick="toggleAccordionSection('toggle-catastrophic')">
                                <span class="d-flex align-items-center gap-2 font-weight-700 text-secondary">
                                    <i class="fa-solid fa-heart-pulse text-danger"></i> ¿Enfermedad Catastrófica?
                                </span>
                                <label class="switch-wrapper" onclick="event.stopPropagation()">
                                    <input type="checkbox" name="has_catastrophic_illness"
                                           id="id_has_catastrophic_illness" class="switch-input switch-red"
                                           {% if form.has_catastrophic_illness.value %}checked{% endif %}
                                           onchange="syncToggleView(this, 'toggle-catastrophic')">
                                    <span class="switch-circle"></span>
                                    <span class="switch-text">{% if form.has_catastrophic_illness.value %}Sí{% else %}
                                        No{% endif %}</span>
                                </label>
                            </div>
                            <div id="toggle-catastrophic"
                                 class="toggle-content {% if not form.has_catastrophic_illness.value %}hidden{% endif %}">
                                <textarea name="catastrophic_illness_description" class="input-field uppercase-input"
                                          placeholder="Describa la enfermedad...">{{ form.catastrophic_illness_description.value|default:'' }}</textarea>
                            </div>
                        </div>

                        <!-- Sustituto -->
                        <div class="w-100">
                            <div class="toggle-header {% if form.is_substitute.value %}active-header{% endif %}"
                                 onclick="toggleAccordionSection('toggle-substitute')">
                                <span class="d-flex align-items-center gap-2 font-weight-700 text-secondary">
                                    <i class="fa-solid fa-people-arrows text-success"></i> ¿Es Sustituto?
                                </span>
                                <label class="switch-wrapper" onclick="event.stopPropagation()">
                                    <input type="checkbox" name="is_substitute" id="id_is_substitute"
                                           class="switch-input switch-blue"
                                           {% if form.is_substitute.value %}checked{% endif %}
                                           onchange="syncToggleView(this, 'toggle-substitute')">
                                    <span class="switch-circle"></span>
                                    <span class="switch-text">{% if form.is_substitute.value %}Sí{% else %}
                                        No{% endif %}</span>
                                </label>
                            </div>
                            <div id="toggle-substitute"
                                 class="toggle-content {% if not form.is_substitute.value %}hidden{% endif %}">
                                <div class="grid-3-cols grid-compact mb-2">
                                    <div class="form-group">
                                        <label class="form-label small">ID Familiar</label>
                                        <input type="text" name="substitute_family_member_id"
                                               value="{{ form.substitute_family_member_id.value|default:'' }}"
                                               class="input-field">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label small">Nombre Familiar</label>
                                        <input type="text" name="substitute_family_member_name"
                                               value="{{ form.substitute_family_member_name.value|default:'' }}"
                                               class="input-field uppercase-input">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label small">Parentesco</label>
                                        <select name="substitute_family_member_relationship"
                                                class="input-field select2-field">
                                            <option value="">-- Seleccione --</option>
                                            {% for r in relationships %}
                                                <option value="{{ r.id }}"
                                                        {% if form.substitute_family_member_relationship.value == r.id %}selected{% endif %}>{{ r.name }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                                <div class="grid-2-cols grid-compact">
                                    <div class="form-group">
                                        <label class="form-label small">Discapacidad Familiar</label>
                                        <select name="substitute_family_member_disability_type"
                                                class="input-field select2-field">
                                            <option value="">-- Seleccione --</option>
                                            {% for dt in disability_types %}
                                                <option value="{{ dt.id }}"
                                                        {% if form.substitute_family_member_disability_type.value == dt.id %}selected{% endif %}>{{ dt.name }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label small">Porcentaje (%)</label>
                                        <input type="number" name="substitute_family_member_disability_percentage"
                                               value="{{ form.substitute_family_member_disability_percentage.value|default:'' }}"
                                               class="input-field">
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>

            <!-- FOOTER FIJO -->
            <div class="modal-footer-fixed">
                <button type="button" onclick="closeModal()" class="btn-secondary">
                    <i class="fa-solid fa-xmark"></i> Descartar
                </button>
                <button type="submit" class="btn-success">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>
