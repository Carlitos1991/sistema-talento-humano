<div class="tab-pane-telework" data-person-id="{{ person.id }}">

    <!-- AVISO PERFIL AJENO -->
    <div id="teleworkReadOnlyAlert" class="alert-banner-info hidden mb-3">
        <i class="fa-solid fa-circle-info me-2 text-primary"></i>
        <span>Usted está visualizando el módulo de teletrabajo de otro empleado. Las opciones de marcación están deshabilitadas.</span>
    </div>

    <div class="telework-dashboard-grid">

        <!-- PANEL 1: CONTROL DE ASISTENCIA -->
        <div class="telework-panel">
            <h5 class="telework-panel-title-center blue">
                <i class="fa-solid fa-fingerprint"></i> Control de Asistencia
            </h5>
            <hr class="telework-divider">

            <!-- Botones centrados de marcación -->
            <div id="teleworkAttendanceGroup" class="telework-center-actions">
                <button type="button"
                        id="btnPunchIncome"
                        class="btn-telework-square green"
                        onclick="markTeleworkAttendance('INCOME', '{{ person.id }}')">
                    <i class="fa-solid fa-plus"></i>
                    <span>Entrada</span>
                </button>
                <button type="button"
                        id="btnPunchExit"
                        class="btn-telework-square red"
                        onclick="markTeleworkAttendance('EXIT', '{{ person.id }}')">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Salida</span>
                </button>
            </div>

            <!-- Listado de Marcaciones del Día -->
            <div class="telework-scroll-area" id="teleworkPunchesContainer">
                <div class="text-center py-4 text-muted small">
                    <i class="fa-solid fa-spinner fa-spin me-1"></i> Cargando marcaciones...
                </div>
            </div>
        </div>

        <!-- PANEL 2: REPORTE DE ACTIVIDADES -->
        <div class="telework-panel">
            <h5 class="telework-panel-title-center green">
                <i class="fa-solid fa-list-check"></i> Reporte de Actividades
            </h5>
            <hr class="telework-divider">

            <!-- Botón central "Nueva Actividad" y botón "Reporte PDF" -->
            <div id="teleworkActivityActionContainer" class="telework-center-actions">
                <!-- Se inyecta dinámicamente según el estado del empleado -->
            </div>

            <!-- Listado de Actividades -->
            <div class="telework-scroll-area" id="teleworkActivitiesContainer">
                <div class="text-center py-4 text-muted small">
                    <i class="fa-solid fa-spinner fa-spin me-1"></i> Cargando actividades...
                </div>
            </div>
        </div>

    </div>
</div>
