<div class="modal-overlay" id="payrollModal">
    <div class="modal-container-medium">

        <div class="modal-header">
            <div class="header-content-group">
                <div class="header-icon-circle"><i class="fas fa-calculator"></i></div>
                <h3 class="header-title-main">
                    {% if form.instance.pk %}Editar{% else %}Nueva{% endif %} Constante
                </h3>
            </div>
            <button type="button" class="btn-close-circle" @click="closeModal">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form action="{{ request.path }}" method="POST" id="constantForm" onsubmit="submitPayrollForm(event)">
            {% csrf_token %}
            <div class="modal-body-custom">
                <div class="form-section-card">
                    <div class="row g-3">
                        <div class="col-md-12 form-group">
                            <label class="form-label">Nombre</label>
                            {{ form.name }}
                        </div>

                        <div class="col-md-6 form-group">
                            <label class="form-label">Código</label>
                            {{ form.code }}
                            <div class="form-text text-muted">Usado internamente (ej: SBU,
                                IESS). No espacios.
                            </div>
                        </div>

                        <div class="col-md-6 form-group">
                            <label class="form-label">Valor</label>
                            {{ form.value }}
                        </div>

                        <div class="col-md-12 form-group">
                            <label class="form-label">Descripción</label>
                            {{ form.description }}
                        </div>
                        <div class="col-md-12 form-group mt-3">
                            <div class="d-flex align-items-center justify-content-center">
                                {{ form.is_active }}
                                <label class="switch-wrapper mb-0" for="{{ form.is_active.id_for_label }}">
                                    <div class="switch-circle"></div>
                                    <span class="switch-text">Activo en el Sistema</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer-fixed">
                <button type="button" class="btn-default-outline" onclick="closeAjaxModal()">Cancelar</button>
                <button type="submit" class="btn-default"><i class="fas fa-save"></i> Guardar</button>
            </div>
        </form>
    </div>
</div>
