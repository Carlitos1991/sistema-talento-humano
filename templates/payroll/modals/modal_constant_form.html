<div class="modal-overlay" id="payrollModal">
    <div class="modal-container-medium">

        <div class="modal-header-refined">
            <div class="header-content-group">
                <div class="header-icon-circle"><i class="fas fa-calculator"></i></div>
                <h3 class="header-title-main">
                    {% if form.instance.pk %}Editar{% else %}Nueva{% endif %} Constante
                </h3>
            </div>
            <button type="button" class="btn-close-modal-refined" onclick="closePayrollModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form action="{{ request.path }}" method="POST" id="constantForm" onsubmit="submitPayrollForm(event)">
            {% csrf_token %}
            <div class="modal-body-custom">
                <div class="form-section-card">
                    <div class="row g-3">
                        <div class="col-md-12 form-group">
                            <label class="form-label">Nombre</label>
                            {{ form.name }}
                        </div>

                        <div class="col-md-6 form-group">
                            <label class="form-label">Código</label>
                            {{ form.code }}
                            <div class="form-text text-muted" style="font-size: 0.8em;">Usado internamente (ej: SBU, IESS). No espacios.</div>
                        </div>

                        <div class="col-md-6 form-group">
                            <label class="form-label">Valor</label>
                            {{ form.value }}
                        </div>

                        <div class="col-md-12 form-group">
                            <label class="form-label">Descripción</label>
                            {{ form.description }}
                        </div>
                        <div class="col-md-12 form-group mt-3">
                            <div class="d-flex align-items-center gap-3">
                                <label class="toggle-switch">
                                    {{ form.is_active }}
                                    <span class="toggle-slider"></span>
                                </label>
                                <span class="font-weight-600 text-primary-bold" style="font-size: 0.95rem;">Activo en el Sistema</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer-fixed">
                <button type="button" class="btn-cancel" onclick="closePayrollModal()">Cancelar</button>
                <button type="submit" class="btn-save"><i class="fas fa-save"></i> Guardar</button>
            </div>
        </form>
    </div>
</div>
