<div class="modal fade" id="payrollModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">
                    {% if form.instance.pk %}
                        <i class="fa-solid fa-pen"></i> Editar Constante
                    {% else %}
                        <i class="fa-solid fa-plus"></i> Nueva Constante
                    {% endif %}
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form action="{{ request.path }}" method="POST" onsubmit="submitPayrollForm(event)">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label fw-bold">Nombre <span class="text-danger">*</span></label>
                            {{ form.name }}
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Código <span class="text-danger">*</span></label>
                            {{ form.code }}
                            <div class="form-text text-muted" style="font-size: 0.8em;">
                                Usado internamente (ej: SBU, IESS). No espacios.
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Valor <span class="text-danger">*</span></label>
                            {{ form.value }}
                        </div>

                        <div class="col-md-12">
                            <label class="form-label fw-bold">Descripción</label>
                            {{ form.description }}
                        </div>
                    </div>
                </div>

                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success">
                        <i class="fa-solid fa-save"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
