<div id="modalReportOptions" class="modal-overlay" style="display: none !important;">
    <div class="modal-container" style="max-width: 550px;">

        <!-- Nueva Cabecera Estandarizada -->
        <div class="modal-header-refined">
            <div class="header-content-group">
                <div class="header-icon-circle"><i class="fas fa-print"></i></div>
                <h3 class="header-title-main">Reportes: <span id="rep-period-name"></span></h3>
            </div>
            <button type="button" class="btn-close-circle" onclick="window.closeReportModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Cuerpo del Modal -->
        <div class="modal-body-custom">
            <div class="list-group mb-4">
                <label class="list-group-item d-flex gap-3 p-3 border rounded mb-2 cursor-pointer"
                       style="background: white;">
                    <input type="radio" name="reportFiltro" value="NORMAL" checked class="custom-radio">
                    <span><strong style="color: #1e293b;">Nómina Mensual</strong><br><small class="text-muted">Excluye retenidos.</small></span>
                </label>
                <label class="list-group-item d-flex gap-3 p-3 border rounded mb-2 cursor-pointer"
                       style="background: white;">
                    <input type="radio" name="reportFiltro" value="REZAGADOS" class="custom-radio">
                    <span><strong style="color: #1e293b;">Alcance / Rezagados</strong><br><small class="text-warning">Solo pendientes de cobro.</small></span>
                </label>
            </div>

            <div id="sellar-container" style="display: none;">
                <button onclick="sellarComoPagados()" class="btn-success-outline w-100 mt-2"
                        style="justify-content: center;">
                    <i class="fas fa-check-double"></i> Sellar como PAGADOS
                </button>
            </div>
        </div>
    </div>
</div>
