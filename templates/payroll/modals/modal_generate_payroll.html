<div id="modalGeneratePayroll" class="modal-overlay modal-payroll-action">
    <div class="modal-container-medium modal-payroll-container">

        <!-- Cabecera Estándar SIGETH -->
        <div class="modal-header-medium">
            <div class="header-content-group">
                <div class="header-icon-circle">
                    <i class="fas fa-cogs"></i>
                </div>
                <h3 class="header-title">Procesar Nómina</h3>
            </div>
            <button type="button" class="btn-close-circle" onclick="window.closeGenerateModal()" title="Cerrar">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Cuerpo del Modal -->
        <div class="modal-body-content modal-body-custom">
            <!-- Estado Cargando -->
            <div id="generate-loading" class="payroll-loading-box">
                <i class="fas fa-spinner fa-spin fa-3x text-primary"></i>
                <p class="payroll-loading-text">Procesando, por favor espere...</p>
            </div>

            <!-- Opciones de Generación -->
            <div id="generate-options">
                <p class="payroll-period-indicator">
                    Periodo: <strong id="gen-period-name"></strong>
                </p>

                <div class="payroll-action-grid">
                    <button type="button" onclick="submitGenerate('missing')" class="action-card action-card-green">
                        <i class="fas fa-user-plus"></i>
                        <div>
                            <strong>Sincronizar Faltantes</strong>
                            <span class="muted">Solo agrega empleados nuevos sin recalcular el resto.</span>
                        </div>
                    </button>

                    <button type="button" onclick="submitGenerate('all')" class="action-card action-card-red">
                        <i class="fas fa-sync-alt"></i>
                        <div>
                            <strong>Recalcular Todo (Normal)</strong>
                            <span class="muted">Borra y regenera el rol principal (corte al día 25).</span>
                        </div>
                    </button>

                    <button type="button" id="btn-generate-scope" onclick="submitGenerate('scope')"
                            class="action-card action-card-gray">
                        <i class="fas fa-code-branch"></i>
                        <div>
                            <strong>Generar Rol de Alcance</strong>
                            <span class="muted">Incluye movimientos y contratos posteriores al día 25.</span>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Pie Fijo -->
        <div class="modal-footer-fixed">
            <button type="button" class="btn-dark-blue-rectangle-outline" onclick="window.closeGenerateModal()">
                Cancelar
            </button>
        </div>
    </div>
</div>
