<div id="modalGeneratePayroll" class="custom-modal-overlay" style="display: none;">
    <div class="custom-modal" style="max-width: 550px;">
        <div class="custom-modal-header" style="background-color: #f8fafc;">
            <h5 style="color: #0f172a; margin: 0;"><i class="fas fa-cogs me-2"></i> Procesar Nómina</h5>
            <button type="button" class="btn-close-modal" onclick="closeGenerateModal()">&times;</button>
        </div>
        <div class="custom-modal-body">
            <div id="generate-loading" style="display: none; text-align: center; padding: 40px;">
                <i class="fas fa-spinner fa-spin fa-3x" style="color: #0f172a;"></i>
                <p style="margin-top: 15px; font-weight: bold; color: #64748b;">Procesando, espere...</p>
            </div>
            <div id="generate-options">
                <p style="margin-bottom: 20px; color: #64748b;">Periodo: <strong id="gen-period-name"></strong></p>
                <div style="display: grid; gap: 15px;">
                    <button onclick="submitGenerate('missing')"
                            style="text-align: left; padding: 15px; display: flex; align-items: center; border: 2px solid #10b981; border-radius: 10px; background: transparent; color: #047857; cursor: pointer;">
                        <i class="fas fa-user-plus fa-2x" style="margin-right: 15px;"></i>
                        <div>
                            <strong style="display: block; font-size: 1.1rem;">Sincronizar Faltantes</strong>
                            <span style="font-size: 0.85rem;">Solo agrega empleados nuevos.</span>
                        </div>
                    </button>
                    <button onclick="submitGenerate('all')"
                            style="text-align: left; padding: 15px; display: flex; align-items: center; border: 2px solid #ef4444; border-radius: 10px; background: transparent; color: #b91c1c; cursor: pointer;">
                        <i class="fas fa-sync-alt fa-2x" style="margin-right: 15px;"></i>
                        <div>
                            <strong style="display: block; font-size: 1.1rem;">Recalcular Todo</strong>
                            <span style="font-size: 0.85rem;">Borra y genera de cero (se pierden cambios manuales).</span>
                        </div>
                    </button>
                </div>
            </div>
        </div>
        <div class="custom-modal-footer">
            <button type="button" class="btn-secondary" onclick="closeGenerateModal()">Cancelar</button>
        </div>
    </div>
</div>
