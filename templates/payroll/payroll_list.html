{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="container-fluid" id="payroll-app">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fa-solid fa-file-invoice-dollar"></i> Gestión de Roles de Pago</h2>
            <div>
                <button class="btn btn-primary" onclick="triggerGenerateModal()">
                    <i class="fa-solid fa-bolt"></i> Generar Roles
                </button>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <label>Seleccionar Periodo:</label>
                <select id="period-selector" class="form-select select2-init" style="width: 300px;">
                    <option value="">-- Seleccione --</option>
                    {% for p in periods %}
                        <option value="{{ p.id }}" {% if current_period.id == p.id %}selected{% endif %}>
                            {{ p }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div id="table-container" class="position-relative">
            {% include 'payroll/partials/partial_payroll_table.html' %}
        </div>

        <div id="modal-root"></div>
        {% include 'payroll/modals/modal_generate_payroll.html' %}
    </div>
{% endblock %}

{% block extra_js %}
    <script>
        // CRÍTICO: Definimos las URL para que los botones del modal global sepan qué procesar
        window.CSRF_TOKEN = "{{ csrf_token }}";
        window.URLS = {
            generateAll: "{% url 'payroll:generate' %}",
            generateMissing: "{% url 'payroll:generate_missing' %}"
        };

        // Función que abre nuestro modal limpio
        function triggerGenerateModal() {
            const periodId = $('#period-selector').val();
            if (!periodId) {
                Swal.fire('Error', 'Seleccione un periodo primero', 'error');
                return;
            }
            const periodName = $('#period-selector option:selected').text().trim();
            if (typeof window.openGenerateModal === 'function') {
                window.openGenerateModal(periodId, periodName);
            } else {
                console.error("No se encontró la función openGenerateModal. Revisa que modal_generate_payroll.js esté cargado.");
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const periodSelector = document.getElementById('period-selector');
            const tableContainer = document.getElementById('table-container');

            // Inicializar Select2
            $(periodSelector).select2().on('change', function (e) {
                window.loadTable(this.value);
            });

            try {
                const initial = periodSelector.value;
                if (initial) {
                    $(periodSelector).val(initial).trigger('change.select2');
                    window.loadTable(initial);
                }
            } catch (e) {
                console.warn('Error inicializando select', e);
            }

            // Función global para recargar la tabla (usada también al terminar de generar roles)
            window.loadTable = function (periodId) {
                if (!periodId) return;

                Swal.fire({
                    title: 'Cargando...',
                    text: 'Obteniendo roles de pago',
                    timerProgressBar: true,
                    didOpen: () => Swal.showLoading()
                });

                fetch(`?period_id=${periodId}`, {
                    headers: {'X-Requested-With': 'XMLHttpRequest'}
                })
                    .then(response => response.json())
                    .then(data => {
                        tableContainer.innerHTML = data.html;
                        Swal.close();
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        Swal.close();
                    });
            };
        });
    </script>

    <script src="{% static 'js/payroll/modal_generate_payroll.js' %}"></script>
    <script src="{% static 'js/payroll/payroll.js' %}"></script>
{% endblock %}
