{% for p in periods %}
    <tr>
        <td class="fw-bold" data-sort="{{ p.year }}{{ p.month_number|stringformat:"02d" }}">{{ p.month }} {{ p.year }}</td>
        <td>{{ p.start_date|date:"d/m/Y" }} - {{ p.end_date|date:"d/m/Y" }}</td>
        <td class="text-center">{{ p.working_days }}</td>
        <td class="text-center">
            {% if p.is_closed %}
                <span class="status-badge inactive"><i class="fas fa-times-circle"></i> Cerrado</span>
            {% else %}
                <span class="status-badge active"><i class="fas fa-check-circle"></i> Abierto</span>
            {% endif %}
        </td>
        <td class="text-center actions">
            <div class="actions-wrapper">
                {% if not p.is_closed %}
                        <button type="button" class="btn-icon btn-views-action" title="Procesar / Recalcular"
                            onclick="openGenerateModal({{ p.id }}, '{{ p.month }} {{ p.year }}', true)">
                        <i class="fas fa-cogs"></i>
                    </button>
                    <a href="{% url 'payroll:novelty_mass_load' %}?period_id={{ p.id }}" class="btn-icon btn-success-action ms-2" title="Cargar Novedades al Periodo">
                        <i class="fas fa-file-excel"></i>
                    </a>
                {% endif %}

                <a href="{% url 'payroll:payslip_list' %}?period_id={{ p.id }}" class="btn-icon btn-search ms-2" title="Ver Roles Generados">
                    <i class="fas fa-list"></i>
                </a>

                <button type="button" class="btn-icon btn-info-action ms-2" title="Generar Reportes"
                        onclick="openReportModal({{ p.id }}, '{{ p.month }} {{ p.year }}')">
                    <i class="fas fa-university"></i>
                </button>
            </div>
        </td>
    </tr>
{% empty %}
    <tr>
        <td colspan="5" class="text-center py-5 text-muted">
            <i class="fas fa-calendar-times fa-3x mb-3"></i><br>
            No hay periodos registrados.
        </td>
    </tr>
{% endfor %}
