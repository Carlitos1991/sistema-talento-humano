{% for r in contributions %}
    <tr>
        <td><strong>{{ r.name }}</strong></td>
        <td><span class="badge-code">{{ r.code }}</span></td>
        <td>
            {% if r.debit_account %}
                {{ r.debit_account.code }}
            {% else %}
                <span class="text-muted">-</span>
            {% endif %}
        </td>
        <td>
            {% if r.credit_account %}
                {{ r.credit_account.code }}
            {% else %}
                <span class="text-muted">-</span>
            {% endif %}
        </td>
        <td class="text-center">
            {% if r.is_active %}
                <span class="status-badge active"><i class="fas fa-check-circle"></i> Activo</span>
            {% else %}
                <span class="status-badge inactive"><i class="fas fa-times-circle"></i> Inactivo</span>
            {% endif %}
        </td>
        <td class="actions">
            <div class="actions-wrapper">
                <button type="button" class="btn-icon btn-views-action" title="Editar Aporte"
                        onclick="openContributionModal('{% url 'payroll:contribution_update' r.pk %}')">
                    <i class="fas fa-pen"></i>
                </button>
            </div>
        </td>
    </tr>
{% endfor %}
