{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="header-card" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #10b981 100%);">
        <div>
            <h1><i class="fas fa-piggy-bank me-2"></i> Fondos de Reserva</h1>
            <p>Listado de empleados activos con estado de Fondos de Reserva y Mensualiza Décimos.</p>
        </div>
    </div>

    <div class="content-table mt-4">
        <div class="table-controls table-controls-grid">
            <div></div>

            <div class="search-box table-controls-right">
                <i class="fas fa-search search-icon"></i>
                <input id="fondos-search-input" type="text" class="table-search-input" placeholder="Buscar por nombre o cédula...">
            </div>
        </div>

        <div id="fondos-reserva-container">
            <div id="fondos-table-content">
                {% include 'payroll/partials/partial_fondos_reserva_table.html' %}
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3">
                <div>
                    <button id="fondos-prev-btn" class="btn btn-sm btn-outline-primary">Anterior</button>
                    <button id="fondos-next-btn" class="btn btn-sm btn-outline-primary ms-2">Siguiente</button>
                </div>
                <div id="fondos-page-info" class="text-muted">Página 1</div>
            </div>
        </div>
    </div>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'js/payroll/payroll.js' %}"></script>
    <script src="{% static 'js/payroll/fondos_reserva.js' %}"></script>
    <script src="{% static 'js/payroll/fondos_reserva_pagination.js' %}"></script>
{% endblock %}
