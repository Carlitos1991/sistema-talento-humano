<!-- Modal para Crear/Editar Nodo de Valoración (100% Nativo SIGETH) -->
<div class="modal-overlay hidden" id="valuationNodeModal">
    <div class="modal-container-medium animate-scale-in" style="max-width: 550px; margin: auto;">
        <div class="modal-header modal-header-gradient">
            <h3 class="modal-title text-white">
                <i class="fa-solid fa-layer-group me-2"></i> <span
                    id="valuationNodeModalTitle">Nuevo Nodo de Valoración</span>
            </h3>
            <button type="button" class="btn-close-modal text-white-opacity" onclick="closeModal('valuationNodeModal')">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form id="valuationNodeForm" onsubmit="submitValuationNodeForm(event)">
            {% csrf_token %}
            <input type="hidden" id="node_id" name="id" value="">
            <input type="hidden" id="node_parent_id" name="parent_id" value="">
            <input type="hidden" id="node_type" name="node_type" value="">

            <div class="modal-body modal-body-custom">
                <!-- Select de Catálogos (ROLE, INSTRUCTION, DECISION, IMPACT, COMPLEXITY) -->
                <div class="form-group mb-3 hidden" id="groupCatalogItem">
                    <label class="form-label" for="node_catalog_item_id">
                        <i class="fa-solid fa-list-ul me-1"></i> Seleccionar Ítem de Catálogo (*)
                    </label>
                    <select class="form-control select2-modal" id="node_catalog_item_id" name="catalog_item_id">
                        <option value="">Seleccione una opción...</option>
                    </select>
                </div>

                <!-- Input de Texto (EXPERIENCE) -->
                <div class="form-group mb-3 hidden" id="groupExperience">
                    <label class="form-label" for="node_name_extra_exp">
                        <i class="fa-solid fa-clock me-1"></i> Descripción de Experiencia (*)
                    </label>
                    <input type="text" id="node_name_extra_exp" class="form-control" placeholder="Ej: Mínimo 24 meses">
                </div>

                <!-- Select de Clasificación (RESULT) -->
                <div class="form-group mb-3 hidden" id="groupResult">
                    <label class="form-label" for="node_occupational_classification_id">
                        <i class="fa-solid fa-bullseye me-1"></i> Vincular Clasificación Ocupacional (*)
                    </label>
                    <select class="form-control select2-modal" id="node_occupational_classification_id"
                            name="occupational_classification_id">
                        <option value="">Seleccione clasificación...</option>
                    </select>
                </div>

                <!-- Valores opcionales (RESULT) -->
                <div class="grid-2-cols mb-3 hidden" id="groupResultExtras">
                    <div class="form-group">
                        <label class="form-label" for="node_minimum_value">
                            <i class="fa-solid fa-arrow-down-short-wide me-1"></i> Puntos Mínimos
                        </label>
                        <input type="number" id="node_minimum_value" name="minimum_value" class="form-control"
                               placeholder="Ej: 1500" min="0" step="1">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="node_level">
                            <i class="fa-solid fa-ranking-star me-1"></i> Nivel
                        </label>
                        <input type="number" id="node_level" name="level" class="form-control" placeholder="Ej: 1"
                               min="0" step="1">
                    </div>
                </div>

                <!-- Denominación Genérica -->
                <div class="form-group mb-3 hidden" id="groupGenericDenomination">
                    <label class="form-label" for="node_name_extra_generic">
                        <i class="fa-solid fa-bookmark me-1"></i> Denominación Genérica (*)
                    </label>
                    <input type="text" id="node_name_extra_generic" class="form-control"
                           placeholder="Ej: Especialista 1">
                </div>
            </div>

            <div class="modal-footer modal-footer-spaced">
                <button type="button" class="btn-cancel" onclick="closeModal('valuationNodeModal')">Cancelar</button>
                <button type="submit" class="btn-save" id="btnSaveValuationNode">
                    <i class="fas fa-save me-1"></i> Guardar
                </button>
            </div>
        </form>
    </div>
</div>
