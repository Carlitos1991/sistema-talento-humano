<div class="modal-overlay" id="matrixModalOverlay">
    <div class="modal-container-medium animate-scale-in" style="max-width: 600px; margin: auto;">
        <div class="modal-header modal-header-gradient">
            <h3 class="modal-title text-white">
                <i class="fa-solid fa-money-bill-trend-up me-2"></i> {{ entry.id|yesno:"Editar,Nuevo" }} Grado
                Ocupacional
            </h3>
            <button type="button" class="btn-close-modal text-white-opacity" onclick="closeModal('matrixModalOverlay')">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form id="matrixForm" onsubmit="submitMatrixForm(event, {{ entry.id|default:'null' }})">
            {% csrf_token %}
            <div class="modal-body modal-body-custom">
                <div class="grid-2-cols">
                    <div class="form-group">
                        <label class="form-label" for="matrix_group">Grupo Ocupacional (*)</label>
                        <input type="text" id="matrix_group" name="occupational_group"
                               class="form-control uppercase-input" value="{{ entry.occupational_group|default:'' }}"
                               placeholder="Ej: SP1" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="matrix_grade">Grado Escala (*)</label>
                        <input type="number" id="matrix_grade" name="grade" class="form-control"
                               value="{{ entry.grade|default:'' }}" placeholder="Ej: 7" min="1" required>
                    </div>
                </div>

                <div class="form-group mt-3">
                    <label class="form-label" for="matrix_rmu">RMU Mensual ($) (*)</label>
                    <input type="number" step="0.01" id="matrix_rmu" name="remuneration" class="form-control"
                           value="{{ entry.remuneration|default:'' }}" placeholder="Ej: 1212.00" required>
                </div>
            </div>

            <div class="modal-footer modal-footer-spaced">
                <button type="button" class="btn-cancel" onclick="closeModal('matrixModalOverlay')">Cancelar</button>
                <button type="submit" class="btn-save" id="btnSaveMatrix">
                    <i class="fas fa-save me-1"></i> Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>
