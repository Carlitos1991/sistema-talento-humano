<div class="modal-overlay" id="catalogModalOverlay">
    <div class="modal-container-medium animate-scale-in" style="max-width: 550px; margin: auto;">
        <div class="modal-header modal-header-gradient">
            <h3 class="modal-title text-white">
                <i class="fa-solid fa-folder-tree me-2"></i> {{ form.instance.pk|yesno:"Editar Catálogo,Nuevo Catálogo" }}
            </h3>
            <button type="button" class="btn-close-modal text-white-opacity"
                    onclick="closeModal('catalogModalOverlay')">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form method="POST" action="
                {% if form.instance.pk %}{% url 'function_manual:catalog_update' form.instance.pk %}{% else %}{% url 'function_manual:catalog_create' %}{% endif %}"
              onsubmit="submitAjaxForm(event)">
            {% csrf_token %}
            <div class="modal-body modal-body-custom">
                <div class="form-group mb-3">
                    <label class="form-label" for="id_name">
                        <i class="fa-solid fa-folder-closed"></i> Nombre del Catálogo (*)
                    </label>
                    <input type="text" name="name" id="id_name" class="form-control uppercase-input"
                           value="{{ form.name.value|default:'' }}" placeholder="Ej: NIVELES DE IMPACTO" required>
                    <div class="invalid-feedback"></div>
                    <p class="form-hint">Nombre descriptivo del catálogo normativo.</p>
                </div>

                <div class="form-group mb-3">
                    <label class="form-label" for="id_code">
                        <i class="fa-solid fa-barcode"></i> Código Interno (*)
                    </label>
                    <input type="text" name="code" id="id_code"
                           class="form-control uppercase-input {% if form.instance.pk %}bg-readonly{% endif %}"
                           value="{{ form.code.value|default:'' }}" placeholder="Ej: IMPACT_LEVELS"
                           {% if form.instance.pk %}readonly{% endif %} required>
                    <div class="invalid-feedback"></div>
                    <p class="form-hint">Identificador único del sistema en mayúsculas.</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="id_description">
                        <i class="fa-solid fa-align-left"></i> Descripción
                    </label>
                    <textarea name="description" id="id_description" class="form-control" rows="3"
                              placeholder="Descripción complementaria (opcional)">{{ form.description.value|default:'' }}</textarea>
                    <div class="invalid-feedback"></div>
                </div>
            </div>

            <div class="modal-footer modal-footer-spaced">
                <button type="button" class="btn-cancel" onclick="closeModal('catalogModalOverlay')">Cancelar</button>
                <button type="submit" class="btn-save"><i class="fas fa-save me-1"></i> Guardar</button>
            </div>
        </form>
    </div>
</div>
