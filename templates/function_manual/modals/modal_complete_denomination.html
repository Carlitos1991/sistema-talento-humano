{% load static %}
<div class="modal-overlay">
    <div class="modal-container-medium" style="width: 700px; margin: auto;">
        <div class="modal-header-medium modal-header-gradient"
             style="background: linear-gradient(to right, #7c3aed, #a855f7);">
            <h3 class="modal-title text-white">
                <i class="fa-solid fa-pen-fancy me-2"></i> Completar Denominación del Cargo
            </h3>
            <button type="button" class="btn-close-modal text-white-opacity" onclick="closeManualModal()">&times;
            </button>
        </div>
        <form id="completeDenominationForm" method="POST" onsubmit="submitCompleteDenomination(event, {{ profile.pk }})">
            {% csrf_token %}
            <div class="modal-body-content modal-body-custom">
                <!-- Info de Perfil -->
                <div class="form-section-card" style="background: #f8fafc; border-bottom: 2px solid #e2e8f0;">
                    <div class="grid-2-cols">
                        <div class="info-group">
                            <label class="info-label text-muted">Unidad Administrativa</label>
                            <div class="info-value">{{ profile.administrative_unit.name }}</div>
                        </div>
                        <div class="info-group">
                            <label class="info-label text-muted">Total Puntos Actividades</label>
                            <div class="info-value font-weight-700">{{ profile.total_activity_points }}</div>
                        </div>
                    </div>
                </div>

                <!-- Campos de Denominación -->
                <div class="form-group mt-4">
                    <label class="form-label font-weight-700 mb-3">
                        <i class="fas fa-layer-group me-2 text-purple-600"></i> Armado de Denominación
                    </label>

                    <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: flex-end;">
                        <!-- Input readonly con denominación actual -->
                        <div class="form-group">
                            <label class="form-label small" style="font-weight: 600; color: #64748b;">Denominación Actual (Genérica)</label>
                            <input type="text"
                                   id="current-denomination"
                                   readonly
                                   class="form-control"
                                   value="{{ profile.specific_job_title }}"
                                   style="background: #f1f5f9; color: #475569; cursor: not-allowed;">
                        </div>

                        <!-- Input para agregar complemento -->
                        <div class="form-group">
                            <label class="form-label small" style="font-weight: 600; color: #64748b;">Complemento a Agregar</label>
                            <input type="text"
                                   id="denomination-complement"
                                   class="form-control"
                                   placeholder="Ej: de Tecnología, de Sistemas..."
                                   style="border: 2px solid #e2e8f0;">
                        </div>
                    </div>

                    <!-- Preview de la denominación final -->
                    <div style="margin-top: 20px; padding: 15px; background: #f0f4f8; border-radius: 8px; border-left: 4px solid #7c3aed;">
                        <label class="form-label small" style="font-weight: 600; color: #64748b; margin-bottom: 8px; display: block;">
                            <i class="fas fa-eye me-2"></i> Vista Previa de la Denominación Final
                        </label>
                        <div style="font-size: 1.1rem; font-weight: 700; color: #7c3aed;">
                            <span id="preview-denomination">{{ profile.specific_job_title }}</span>
                        </div>
                    </div>

                    <div class="alert-info mt-3" style="font-size: 0.85rem;">
                        <i class="fas fa-exclamation-circle me-1"></i> <strong>Importante:</strong> Este cambio es permanente y
                        no podrá ser modificado nuevamente.
                    </div>
                </div>
            </div>

            <div class="modal-footer-medium modal-footer-spaced">
                <button type="button" class="btn-cancel" onclick="closeManualModal()">Cancelar</button>
                <button type="submit" id="btn-submit-complete-denom" class="btn-save"
                        style="background: #7c3aed;">
                    <i class="fas fa-check me-2"></i> Actualizar Denominación
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Actualizar preview en tiempo real
    document.addEventListener('DOMContentLoaded', function() {
        const current = document.getElementById('current-denomination').value;
        const complement = document.getElementById('denomination-complement');
        const preview = document.getElementById('preview-denomination');

        complement.addEventListener('input', function() {
            if (this.value.trim()) {
                preview.textContent = current + ' ' + this.value.trim();
            } else {
                preview.textContent = current;
            }
        });
    });
</script>
