<div class="modal-overlay" id="modalReportPdf">
    <div class="modal-container-medium animate-scale-in" style="max-width: 480px; margin: auto;">
        <!-- Header -->
        <div class="modal-header modal-header-gradient"
             style="background: linear-gradient(135deg, #0d6efd 0%, #0d5ecd 100%);">
            <h3 class="modal-title text-white">
                <i class="fas fa-file-pdf me-2"></i> Exportar a PDF
            </h3>
            <button type="button" class="btn-close-modal text-white-opacity" onclick="closeModal('modalReportPdf')">
                &times;
            </button>
        </div>

        <!-- Body -->
        <div class="modal-body modal-body-custom">
            <p class="text-sm text-muted mb-3">
                Seleccione el usuario que autorizará este reporte de actividades.
            </p>

            <form id="formReportPdf" onsubmit="submitReportPdf(event, {{ profile.id }})">
                {% csrf_token %}
                <div class="form-group mb-3">
                    <label for="authority-select" class="form-label">
                        Usuario que Autoriza:
                    </label>
                    <select id="authority-select" name="authority_id" class="form-control select2-modal"
                            data-ajax-url="{% url 'function_manual:api_user_search' %}"
                            data-placeholder="Buscar por nombres, apellidos o cédula"
                            data-minimum-input-length="1" required>
                        <option value="">-- Seleccione un usuario --</option>
                    </select>
                </div>

                <div class="alert alert-info mt-2">
                    <i class="fas fa-info-circle me-1"></i>
                    El reporte se generará con la firma autorizada para {{ profile.specific_job_title }}
                    en {{ profile.administrative_unit.name }}.
                </div>

                <div class="modal-footer modal-footer-spaced mt-3">
                    <button type="button" class="btn-cancel" onclick="closeModal('modalReportPdf')">Cancelar</button>
                    <button type="submit" id="btn-submit-report-pdf" class="btn-save" style="background: #0d6efd;">
                        <i class="fas fa-download me-1"></i> Descargar PDF
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Inicializar Select2 al renderizarse en el modal
    $(document).ready(function () {
        const select = $('#authority-select');
        select.select2({
            dropdownParent: $('#modalReportPdf'),
            width: '100%',
            allowClear: true,
            ajax: {
                url: select.data('ajax-url'),
                dataType: 'json',
                delay: 250,
                data: params => ({term: params.term}),
                processResults: data => ({results: data.results || []}),
                cache: true
            }
        });
    });

    function submitReportPdf(e, profileId) {
        e.preventDefault();
        const authorityId = document.getElementById('authority-select').value;
        const btn = document.getElementById('btn-submit-report-pdf');

        if (!authorityId) {
            Swal.fire({icon: 'warning', title: 'Atención', text: 'Seleccione un usuario firmante.'});
            return;
        }

        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generando...';
        btn.disabled = true;

        fetch('/function_manual/api/report_activities_pdf/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken(),
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify({profile_id: profileId, authority_id: parseInt(authorityId)})
        })
            .then(response => {
                if (response.ok) {
                    return response.blob().then(blob => {
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `Actividades_${profileId}.pdf`;
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        window.URL.revokeObjectURL(url);
                        closeModal('modalReportPdf');
                        showToast('PDF generado correctamente.', 'success');
                    });
                }
                return response.json().then(data => {
                    throw new Error(data.message);
                });
            })
            .catch(err => {
                Swal.fire({icon: 'error', title: 'Error', text: err.message || 'No se pudo generar el reporte.'});
                btn.innerHTML = '<i class="fas fa-download me-1"></i> Descargar PDF';
                btn.disabled = false;
            });
    }
</script>
