<div class="modal-overlay" id="competencyModalOverlay">
    <div class="modal-container-medium animate-scale-in" style="max-width: 600px; margin: auto;">
        <div class="modal-header modal-header-gradient">
            <h3 class="modal-title text-white">
                <i class="fa-solid fa-brain me-2"></i> {{ competency.id|yesno:"Editar Competencia,Nueva Competencia" }}
            </h3>
            <button type="button" class="btn-close-modal text-white-opacity"
                    onclick="closeModal('competencyModalOverlay')">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form id="competencyForm" onsubmit="submitCompetencyForm(event, {{ competency.id|default:'null' }})">
            {% csrf_token %}
            <div class="modal-body modal-body-custom">
                <div class="form-group mb-3">
                    <label class="form-label" for="comp_name">Nombre de la Competencia (*)</label>
                    <input type="text" id="comp_name" name="name" class="form-control"
                           value="{{ competency.name|default:'' }}" placeholder="Ej: Liderazgo Estratégico" required>
                </div>

                <div class="grid-2-cols mb-3">
                    <div class="form-group">
                        <label class="form-label" for="comp_type">Tipo (*)</label>
                        <select id="comp_type" name="type" class="form-control" required>
                            <option value="TECHNICAL" {% if competency.type == 'TECHNICAL' %}selected{% endif %}>
                                Técnica
                            </option>
                            <option value="BEHAVIORAL" {% if competency.type == 'BEHAVIORAL' %}selected{% endif %}>
                                Conductual
                            </option>
                            <option value="TRANSVERSAL" {% if competency.type == 'TRANSVERSAL' %}selected{% endif %}>
                                Transversal
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="comp_level">Nivel Sugerido</label>
                        <select id="comp_level" name="suggested_level" class="form-control select2-modal">
                            <option value="">Seleccione nivel...</option>
                            {% for lvl in complexity_levels %}
                                <option value="{{ lvl.id }}"
                                        {% if competency.suggested_level_id == lvl.id %}selected{% endif %}>{{ lvl.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="comp_definition">Definición / Descripción (*)</label>
                    <textarea id="comp_definition" name="definition" rows="4" class="form-control"
                              placeholder="Describa la competencia y conductas observables..."
                              required>{{ competency.definition|default:'' }}</textarea>
                </div>
            </div>

            <div class="modal-footer modal-footer-spaced">
                <button type="button" class="btn-cancel" onclick="closeModal('competencyModalOverlay')">Cancelar
                </button>
                <button type="submit" class="btn-save" id="btnSaveCompetency">
                    <i class="fas fa-save me-1"></i> Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>
