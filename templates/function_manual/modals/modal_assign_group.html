<!-- Modal para Asignar Grupo Ocupacional (100% Nativo SIGETH) -->
<div class="modal-overlay hidden" id="modalAssignGroup">
    <form id="formAssignGroup" onsubmit="submitAssignGroup(event)" class="modal-container-medium animate-scale-in"
          style="max-width: 700px; margin: auto;">
        {% csrf_token %}
        <input type="hidden" id="assign_group_profile_id" name="profile_id" value="">

        <!-- HEADER -->
        <div class="modal-header modal-header-gradient">
            <h3 class="modal-title text-white">
                <i class="fa-solid fa-scale-balanced me-2"></i> Asignar Grupo Ocupacional
            </h3>
            <button type="button" class="btn-close-modal text-white-opacity" onclick="closeModal('modalAssignGroup')">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- BODY -->
        <div class="modal-body modal-body-custom">
            <p class="text-sm text-gray-600 mb-4">
                Seleccione el grupo ocupacional correspondiente basado en la valoración normativa del perfil.
            </p>

            <!-- Loading Spinner -->
            <div id="assignGroupLoading" class="text-center py-4">
                <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
                <p class="mt-2 text-sm text-muted">Cargando opciones de la cadena de valoración...</p>
            </div>

            <!-- Contenedor dinámico de cadena -->
            <div id="assignGroupChainContainer" class="valuation-chain-container mb-4 hidden">
                <!-- Se inyecta por JS la cadena y el selector de RESULT -->
            </div>
        </div>

        <!-- FOOTER -->
        <div class="modal-footer modal-footer-spaced">
            <button type="button" class="btn-cancel" onclick="closeModal('modalAssignGroup')">Cancelar</button>
            <button type="submit" id="btnSubmitAssignGroup" class="btn-save" disabled>
                <i class="fas fa-check me-1"></i> Asignar Grupo
            </button>
        </div>
    </form>
</div>
