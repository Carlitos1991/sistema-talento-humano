<div class="modal-overlay" id="modalItemList">
    <div class="modal-container-large animate-scale-in"
         style="width: 850px; margin: auto; max-height: 88vh; display: flex; flex-direction: column;">
        <div class="modal-header-medium modal-header-gradient">
            <h3 class="modal-title text-white">
                <i class="fa-solid fa-list-check me-2"></i> Ítems del Catálogo: <span
                    id="modalCatalogTitle">{{ catalog.name }}</span>
            </h3>
            <button type="button" class="btn-close-modal text-white-opacity" onclick="closeModal('modalItemList')">
                &times;
            </button>
        </div>

        <div class="modal-body-content modal-body-custom"
             style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
            <div class="table-controls mb-3"
                 style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                <div class="search-box" style="max-width: 320px;">
                    <input type="text" id="inputSearchItems" class="table-search-input input-field"
                           placeholder="Filtrar por nombre o código...">
                </div>
                {% if perms.function_manual.add_manualcatalogitem %}
                    <button type="button" class="btn btn-create" onclick="openCreateItemFromCatalog({{ catalog.id }})">
                        <i class="fas fa-plus me-1"></i> Nuevo Ítem
                    </button>
                {% endif %}
            </div>

            <div class="table-container" style="flex: 1; min-height: 280px; max-height: 380px; overflow-y: auto;">
                <table class="managed-table" id="catalogItemsTable">
                    <thead>
                    <tr>
                        <th width="40%">Nombre</th>
                        <th width="25%">Código</th>
                        <th width="20%">Estado</th>
                        <th width="15%" class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="catalogItemsTbody">
                    <!-- Filas inyectadas mediante JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="modal-footer-spaced">
            <button type="button" class="btn-cancel" onclick="closeModal('modalItemList')">Cerrar</button>
        </div>
    </div>
</div>
