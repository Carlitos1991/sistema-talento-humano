<div class="modal-overlay" id="itemModalOverlay">
    <div class="modal-container-medium animate-scale-in" style="max-width: 650px; margin: auto;">
        <div class="modal-header modal-header-gradient">
            <h3 class="modal-title text-white">
                <i class="fa-solid fa-tag me-2"></i> {{ item_form.instance.pk|yesno:"Editar Ítem,Nuevo Ítem" }}
            </h3>
            <button type="button" class="btn-close-modal text-white-opacity" onclick="closeModal('itemModalOverlay')">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form method="POST" action="
                {% if item_form.instance.pk %}{% url 'function_manual:catalog_item_update' item_form.instance.pk %}{% else %}{% url 'function_manual:catalog_item_create' %}{% endif %}"
              onsubmit="submitAjaxForm(event)">
            {% csrf_token %}
            <input type="hidden" name="catalog_id" id="item_catalog_id" value="{{ catalog.id|default:'' }}">

            <div class="modal-body modal-body-custom">
                <div class="grid-2-cols">
                    <div class="form-group">
                        <label class="form-label" for="id_item_name">Nombre del Ítem (*)</label>
                        <input type="text" name="name" id="id_item_name" class="form-control"
                               value="{{ item_form.name.value|default:'' }}" placeholder="Ej: Analizar" required>
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="id_item_code">Código Técnico (*)</label>
                        <input type="text" name="code" id="id_item_code"
                               class="form-control uppercase-input {% if item_form.instance.pk %}bg-readonly{% endif %}"
                               value="{{ item_form.code.value|default:'' }}" placeholder="Ej: ANALIZAR"
                               {% if item_form.instance.pk %}readonly{% endif %} required>
                        <div class="invalid-feedback"></div>
                    </div>
                </div>

                <div class="form-group mt-3">
                    <label class="form-label" for="id_item_description">Descripción / Observación</label>
                    <textarea name="description" id="id_item_description" class="form-control" rows="2"
                              placeholder="Detalle técnico u observación...">{{ item_form.description.value|default:'' }}</textarea>
                    <div class="invalid-feedback"></div>
                </div>

                <div class="form-group mt-3" id="targetRoleGroup">
                    <label class="form-label" for="id_target_role">
                        <i class="fa-solid fa-users-gear me-1"></i> Rol Permitido (Estructura de Valoración)
                    </label>
                    <select name="target_role" id="id_target_role" class="form-control select2-modal">
                        <option value="">Aplica para todos los roles...</option>
                        {% for role in role_nodes %}
                            <option value="{{ role.id }}"
                                    {% if item_form.target_role.value == role.id %}selected{% endif %}>
                                {{ role.catalog_item.name|default:role.name_extra }}
                            </option>
                        {% endfor %}
                    </select>
                    <p class="form-hint">Especifique si este verbo o parámetro aplica exclusivamente a un rol.</p>
                </div>
            </div>

            <div class="modal-footer modal-footer-spaced">
                <button type="button" class="btn-cancel" onclick="closeModal('itemModalOverlay')">Cancelar</button>
                <button type="submit" class="btn-save"><i class="fas fa-save me-1"></i> Guardar Ítem</button>
            </div>
        </form>
    </div>
</div>
