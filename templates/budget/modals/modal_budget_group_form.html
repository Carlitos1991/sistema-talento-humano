{% load static %}
<div class="modal-overlay hidden">
    <div class="modal-container-small">
        <form method="POST" action="{{ request.path }}" onsubmit="submitAjaxForm(event)">
            {% csrf_token %}

            <!-- HEADER -->
            <div class="modal-header-medium">
                <h3 class="header-title">
                    <i class="fas fa-pen me-2"></i> Editar Nombre de Agrupación
                </h3>
                <button type="button" class="btn-close-circle" onclick="closeModal()" title="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- BODY -->
            <div class="modal-body-content modal-body-custom">
                <div class="alert alert-info mb-3">
                    <i class="fas fa-info-circle me-1"></i>
                    <span>Los códigos son inmutables por integridad presupuestaria. Puede personalizar el nombre descriptivo para reportes.</span>
                </div>

                <div class="form-section-card">
                    <div class="row g-3">
                        <div class="col-md-6 form-group">
                            <label class="form-label">Código Corto (TH)</label>
                            <input type="text" class="input-field readonly-styled"
                                   value="{{ form.instance.short_code }}" readonly tabindex="-1">
                        </div>
                        <div class="col-md-6 form-group">
                            <label class="form-label">Código Base</label>
                            <input type="text" class="input-field readonly-styled"
                                   value="{{ form.instance.base_code }}" readonly tabindex="-1">
                        </div>
                        <div class="col-md-12 form-group">
                            <label class="form-label" for="{{ form.name.id_for_label }}">
                                Nombre a mostrar en reportes <span class="text-red">*</span>
                            </label>
                            {{ form.name }}
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- FOOTER -->
            <div class="modal-footer-medium modal-footer-spaced">
                <button type="button" class="btn-default-outline" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-dark-blue-rectangle">
                    <i class="fas fa-save me-1"></i> Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>
