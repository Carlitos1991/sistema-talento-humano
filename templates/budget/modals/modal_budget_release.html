{% load static %}
<div class="modal-overlay hidden">
    <div class="modal-container-small">
        <form method="POST" action="{% url 'budget:budget_release' line.pk %}" onsubmit="submitAjaxForm(event)">
            {% csrf_token %}

            <!-- HEADER -->
            <div class="modal-header-medium">
                <h3 class="header-title">
                    <i class="fa-solid fa-user-minus me-2"></i> Liberar Partida Presupuestaria
                </h3>
                <button type="button" class="btn-close-circle" onclick="closeModal()" title="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- BODY -->
            <div class="modal-body-content modal-body-custom">
                <div class="alert alert-warning mb-3">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>Se desvinculará al custodio actual de la partida y su estado pasará a <strong>LIBRE</strong>.</span>
                </div>

                <div class="form-section-card mb-3">
                    <div class="row g-2 small">
                        <div class="col-md-6"><strong>Código:</strong><br><span class="text-blue">{{ line.code }}</span>
                        </div>
                        <div class="col-md-6"><strong># Individual:</strong><br><span
                                class="font-monospace bold">{{ line.number_individual|default:"S/N" }}</span></div>
                        <div class="col-md-12 mt-2"><strong>Custodio Actual:</strong><br><strong
                                class="text-red">{{ line.current_employee.person.full_name }}</strong></div>
                    </div>
                </div>

                <div class="form-section-card">
                    <div class="form-group mb-3">
                        <label class="form-label" for="release-fecha-fin">Fecha de Fin / Salida <span
                                class="text-red">*</span></label>
                        <input type="date" name="fecha_fin" id="release-fecha-fin" class="input-field" required>
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="form-group mb-0">
                        <label class="form-label" for="release-observation">Motivo de Liberación</label>
                        <textarea name="observation" id="release-observation" class="form-control" rows="2"
                                  placeholder="Motivo o referencia..."></textarea>
                    </div>
                </div>
            </div>

            <!-- FOOTER -->
            <div class="modal-footer-medium modal-footer-spaced">
                <button type="button" class="btn-default-outline" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-danger">
                    <i class="fa-solid fa-user-xmark me-1"></i> Confirmar Liberación
                </button>
            </div>
        </form>
    </div>
</div>
