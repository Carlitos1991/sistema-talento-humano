{% load static %}
<div class="modal-overlay hidden">
    <div class="modal-container-small">
        <form method="POST" action="{% url 'budget:assign_individual_number' budget_line.pk %}"
              onsubmit="submitAjaxForm(event)">
            {% csrf_token %}

            <!-- HEADER -->
            <div class="modal-header-medium">
                <h3 class="header-title">
                    <i class="fa-solid fa-hashtag me-2"></i> Asignar Número Individual
                </h3>
                <button type="button" class="btn-close-circle" onclick="closeModal()" title="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- BODY -->
            <div class="modal-body-content modal-body-custom">
                <div class="alert alert-info mb-3">
                    <i class="fa-solid fa-circle-info"></i>
                    <span><strong>Código de Partida:</strong> {{ budget_line.code }}</span>
                </div>

                <div class="form-section-card">
                    <div class="form-group mb-3">
                        <label class="form-label" for="id_individual_number_input">
                            Número de Partida Individual <span class="text-red">*</span>
                        </label>
                        {{ form.number }}
                        <small class="form-hint">Ingrese un número entre 1 y 9999</small>
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="alert alert-warning m-0">
                        <i class="fa-solid fa-lightbulb"></i>
                        <div class="small">
                            <strong>Formato automático:</strong>
                            <ul class="m-0 ps-3 mt-1">
                                <li>1-9 → <strong>000X</strong></li>
                                <li>10-99 → <strong>00XX</strong></li>
                                <li>100-999 → <strong>0XXX</strong></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- FOOTER -->
            <div class="modal-footer-medium modal-footer-spaced">
                <button type="button" class="btn-default-outline" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-dark-blue-rectangle">
                    <i class="fa-solid fa-check-double me-1"></i> Asignar Número
                </button>
            </div>
        </form>
    </div>
</div>
