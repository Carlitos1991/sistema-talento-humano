{% load static %}
<div class="table-container">
    <div class="table-scroll-top">
        <table class="managed-table exportable-table"
               data-title="Reporte Estructura Presupuestaria"
               data-filename="Estructura_Presupuestaria"
               data-page-size="10">
            <thead>
            <tr>
                <th class="width-20" data-field="code"><i class="fa-solid fa-hashtag me-1"></i> Código</th>
                <th class="width-50" data-field="name"><i class="fa-solid fa-briefcase me-1"></i> Nombre</th>
                <th class="width-15 text-center no-sort"><i class="fa-regular fa-circle-check me-1"></i> Estado</th>
                <th class="width-15 text-center no-sort actions"><i class="fa-solid fa-gears me-1"></i> Acciones</th>
            </tr>
            </thead>
            <tbody>
            {% for item in items %}
                <tr>
                    <td><span class="badge badge-gray font-monospace">{{ item.code }}</span></td>
                    <td><strong>{{ item.name }}</strong></td>
                    <td class="text-center">
                        {% if item.is_active %}
                            <span class="badge badge-green">Activo</span>
                        {% else %}
                            <span class="badge badge-red">Inactivo</span>
                        {% endif %}
                    </td>
                    <td class="actions text-center">
                        <div class="actions-wrapper">
                            <!-- Navegación al siguiente nivel jerárquico -->
                            {% if nav_url_name %}
                                <a href="{% url nav_url_name item.id %}" class="btn-blue-circle"
                                   title="Ver Siguiente Nivel">
                                    <i class="fas {% if model_type == 'program' %}fa-sitemap{% elif model_type == 'subprogram' %}fa-folder-tree{% else %}fa-tasks{% endif %}"></i>
                                </a>
                            {% endif %}

                            <!-- Editar Nivel -->
                            <button type="button" class="btn-yellow-circle"
                                    onclick="openAjaxModal('{% url 'budget:structure_edit' model_type item.id %}')"
                                    title="Editar">
                                <i class="fas fa-pencil"></i>
                            </button>

                            <!-- Toggle de Estado con SweetAlert2 de main.js -->
                            <button type="button"
                                    class="{% if item.is_active %}btn-green-circle{% else %}btn-red-circle{% endif %}"
                                    onclick="toggleStatusAjax('{% url 'budget:structure_toggle' model_type item.id %}', '{{ item.name|escapejs }}', {{ item.is_active|yesno:'true,false' }})"
                                    title="{% if item.is_active %}Desactivar{% else %}Activar{% endif %}">
                                <i class="fas {% if item.is_active %}fa-power-off{% else %}fa-toggle-on{% endif %}"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="4">
                        <div class="empty-state-container">
                            <i class="fa-solid fa-inbox empty-state-icon"></i>
                            <p class="empty-state-text">No se encontraron registros en este nivel.</p>
                        </div>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
