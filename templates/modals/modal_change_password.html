<!-- Modal: Cambiar Contraseña -->
<div id="changePasswordModal" class="modal-overlay hidden">
    <div class="modal-dialog" style="max-width: 450px;">
        <div class="modal-header">
            <h2 class="modal-title">
                <i class="fa-solid fa-key"></i> Cambiar Contraseña
            </h2>
            <button type="button" class="modal-close" onclick="closeChangePasswordModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="modal-body">
            <form id="changePasswordForm">
                {% csrf_token %}

                <!-- Nueva Contraseña -->
                <div class="form-group mb-3">
                    <label for="newPassword" class="form-label">
                        <i class="fa-solid fa-lock"></i> Nueva Contraseña
                    </label>
                    <input type="password" id="newPassword" name="new_password" class="form-control"
                           placeholder="Ingrese la nueva contraseña"
                           required>
                    <small class="form-text text-muted d-block mt-1">
                        <i class="fa-solid fa-circle-info"></i> 
                        Mínimo 8 caracteres, incluir mayúsculas, minúsculas y números.
                    </small>
                </div>

                <!-- Confirmar Contraseña -->
                <div class="form-group mb-3">
                    <label for="confirmPassword" class="form-label">
                        <i class="fa-solid fa-lock-open"></i> Confirmar Contraseña
                    </label>
                    <input type="password" id="confirmPassword" name="confirm_password" class="form-control"
                           placeholder="Repita la nueva contraseña"
                           required>
                    <div id="passwordMatchMessage" class="mt-2" style="display: none;">
                        <small id="matchText"></small>
                    </div>
                </div>

                <!-- Requisitos de la contraseña -->
                <div class="password-requirements mt-4 p-3 bg-light rounded">
                    <label class="form-label mb-2">Requisitos:</label>
                    <ul>
                        <li id="req-length" class="text-danger">
                            <span>●</span> Mínimo 8 caracteres
                        </li>
                        <li id="req-uppercase" class="text-danger">
                            <span>●</span> Al menos una mayúscula (A-Z)
                        </li>
                        <li id="req-lowercase" class="text-danger">
                            <span>●</span> Al menos una minúscula (a-z)
                        </li>
                        <li id="req-number" class="text-danger">
                            <span>●</span> Al menos un número (0-9)
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeChangePasswordModal()">
                <i class="fa-solid fa-xmark"></i> Cancelar
            </button>
            <button type="button" class="btn btn-primary" id="submitChangePasswordBtn" onclick="submitChangePassword()" disabled>
                <i class="fa-solid fa-check"></i> Cambiar Contraseña
            </button>
        </div>
    </div>
</div>
