{% load static %}
<div class="modal-overlay">
    <div class="modal-container-medium">
        <div class="modal-header-medium">
            <div class="header-content-group">
                <div class="header-icon-circle">
                    <i class="fas fa-user-check"></i>
                </div>
                <h3 class="header-title">Asignar Responsable de Trámite</h3>
            </div>
            <button type="button" class="btn-close-circle" onclick="closeModal()" title="Cerrar">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="modal-body modal-body-custom">
            <div class="alert alert-info">
                <i class="fas fa-circle-info"></i>
                <div>Asignando <strong>{{ count }}</strong> notificación(es) seleccionada(s).</div>
            </div>

            <form id="assignNotificationForm" action="{% url 'sanctions:assign_notification_bulk' %}" method="post"
                  autocomplete="off">
                {% csrf_token %}
                <input type="hidden" name="notification_ids" value="{{ notification_ids }}">

                <div class="form-section-card">
                    <div class="form-group">
                        <label class="form-label" for="select-responsible-ajax">Buscar Responsable *</label>
                        <select id="select-responsible-ajax" name="assigned_to" class="input-field select2" required
                                style="width: 100%;">
                            <option value="">Escriba para buscar usuario...</option>
                        </select>
                    </div>

                    <div class="form-group mt-3">
                        <label class="form-label" for="id_observation">Observaciones / Instrucciones</label>
                        <textarea name="observation" id="id_observation" class="input-field" rows="3"
                                  placeholder="Ej: Revisar descargos del empleado..."></textarea>
                    </div>
                </div>

                <div class="modal-footer-fixed">
                    <button type="button" class="btn-default-outline" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-success">
                        <i class="fas fa-check-circle me-1"></i> Confirmar Asignación
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
