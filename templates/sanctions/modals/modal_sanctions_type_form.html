{% load static %}
<div class="modal-overlay">
    <div class="modal-container-medium">

        <!-- HEADER -->
        <div class="modal-header-medium">
            <div class="header-content-group">
                <div class="header-icon-circle">
                    <i class="fas fa-gavel"></i>
                </div>
                <h3 class="header-title">{% if form.instance.pk %}Editar Tipo de Sanción{% else %}Nuevo Tipo de
                    Sanción{% endif %}</h3>
            </div>
            <button type="button" class="btn-close-circle" onclick="closeModal()" title="Cerrar">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- BODY -->
        <div class="modal-body modal-body-custom">
            <form id="sanctionTypeForm" method="post" action="
                    {% if form.instance.pk %}{% url 'sanctions:sanction_type_update' form.instance.pk %}{% else %}{% url 'sanctions:sanction_type_create' %}{% endif %}"
                  autocomplete="off">
                {% csrf_token %}

                <div class="form-section-card">
                    <div class="form-group">
                        <label class="form-label" for="{{ form.name.id_for_label }}">Nombre de la Sanción *</label>
                        {{ form.name }}
                        <div class="invalid-feedback" id="error-name"></div>
                    </div>

                    <div class="form-group mt-3">
                        <label class="form-label" for="{{ form.description.id_for_label }}">Descripción</label>
                        {{ form.description }}
                        <div class="invalid-feedback" id="error-description"></div>
                    </div>
                </div>

                <div class="form-section-card mt-3">
                    <div class="section-title"><i class="fas fa-sliders text-green"></i> Opciones Generales</div>
                    <div class="grid-2-cols">
                        <div class="form-group mb-0">
                            <label class="form-label">¿Requiere Adjunto?</label>
                            <label class="switch-wrapper">
                                {{ form.requires_attachment }}
                                <span class="switch-circle"></span>
                                <span class="switch-text">Obligatorio</span>
                            </label>
                        </div>
                        <div class="form-group mb-0">
                            <label class="form-label">Estado</label>
                            <label class="switch-wrapper">
                                {{ form.is_active }}
                                <span class="switch-circle"></span>
                                <span class="switch-text">Activo</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="form-section-card mt-3">
                    <div class="section-title"><i class="fas fa-signature text-green"></i> Firmas Autorizadas</div>
                    <div class="grid-2-cols">
                        <div class="form-group">
                            <label class="form-label" for="{{ form.authority_1.id_for_label }}">Firma 1</label>
                            {{ form.authority_1 }}
                            <div class="invalid-feedback" id="error-authority_1"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="{{ form.authority_2.id_for_label }}">Firma 2</label>
                            {{ form.authority_2 }}
                            <div class="invalid-feedback" id="error-authority_2"></div>
                        </div>
                    </div>
                    <div class="grid-2-cols mt-3">
                        <div class="form-group">
                            <label class="form-label" for="{{ form.reviewer.id_for_label }}">Revisado por</label>
                            {{ form.reviewer }}
                            <div class="invalid-feedback" id="error-reviewer"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="{{ form.register.id_for_label }}">Registrado por</label>
                            {{ form.register }}
                            <div class="invalid-feedback" id="error-register"></div>
                        </div>
                    </div>
                </div>

                <!-- FOOTER -->
                <div class="modal-footer-fixed">
                    <button type="button" class="btn-default-outline" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-success">
                        <i class="fas fa-save me-1"></i> Guardar
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>
