<div class="modal-container-medium shadow-card" style="max-width: 900px; width: min(900px, calc(100vw - 2rem));">
    <form id="modalForm" method="post" action="{% if mapping and mapping.pk %}{% url 'sanctions:notification_mapping_update' mapping.pk %}{% else %}{% url 'sanctions:notification_mapping_create' %}{% endif %}">
        {% csrf_token %}

        <div class="modal-header-medium modal-header-gradient">
            <h3 class="modal-title text-white">
                <i class="fa-solid fa-diagram-project me-2"></i>
                {% if mapping and mapping.pk %}Editar Mapeo{% else %}Nuevo Mapeo{% endif %}
            </h3>
            <button type="button" class="btn-close-modal text-white-opacity js-close-modal">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="modal-body-content modal-body-custom">
            <div id="global-errors" style="display:none;" class="alert alert-danger mb-3"></div>

            <div class="form-group mb-3">
                <label class="form-label">Marcador <span class="text-danger">*</span></label>
                {{ form.placeholder }}
                <div class="invalid-feedback"></div>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">Etiqueta <span class="text-danger">*</span></label>
                {{ form.label }}
                <div class="invalid-feedback"></div>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">Expresión <span class="text-danger">*</span></label>
                {{ form.expression }}
                <div class="invalid-feedback"></div>
                <small class="form-hint">Ej.: person.first_name + " " + person.last_name o today</small>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">Descripción</label>
                {{ form.description }}
                <div class="invalid-feedback"></div>
            </div>

            <div class="grid-2-cols mb-3">
                <div class="d-flex align-items-center justify-content-between p-2 border rounded bg-white">
                    <label class="form-label mb-0" for="{{ form.is_active.id_for_label }}">Activo</label>
                    <label class="toggle-switch">
                        {{ form.is_active }}
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="form-group">
                    <label class="form-label">Orden</label>
                    {{ form.order }}
                    <div class="invalid-feedback"></div>
                </div>
            </div>
        </div>

        <div class="modal-footer-medium modal-footer-spaced">
            <button type="button" class="btn-cancel js-close-modal"><i class="fa-solid fa-times"></i> Cancelar</button>
            <button type="submit" class="btn-save"><i class="fa-solid fa-save"></i> Guardar</button>
        </div>
    </form>
</div>
