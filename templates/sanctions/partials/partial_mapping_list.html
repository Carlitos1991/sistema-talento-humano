<div class="table-container">
    <table>
        <thead>
        <tr>
            <th>Marcador</th>
            <th>Etiqueta</th>
            <th>Expresión</th>
            <th class="text-center">Estado</th>
        </tr>
        </thead>
        <tbody>
        {% for mapping in mappings %}
            <tr>
                <td style="font-weight: 500;">{{ mapping.placeholder }}</td>
                <td>{{ mapping.label }}</td>
                <td><code style="white-space: normal; word-break: break-word;">{{ mapping.expression }}</code></td>
                <td class="text-center">
                    {% if mapping.is_active %}
                        <span class="status-badge active">Activo</span>
                    {% else %}
                        <span class="status-badge inactive">Inactivo</span>
                    {% endif %}
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="4" class="text-center" style="padding: 2rem;">
                    <i class="fa-solid fa-inbox" style="font-size: 3rem; color: #ccc;"></i>
                    <p style="margin-top: 1rem; color: #666;">No hay mapeos registrados</p>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
